<script>
const DATA = JSON.parse(document.getElementById('engineering-data').textContent);
const STORAGE_KEY = 'standalone_engineering_basket';

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Trade calculator -- click a material you're short on to see what you could trade at a Material
// Trader instead. Ratio math and family/type rules are the real Material Trader mechanic, see
// docs/MaterialTraderMechanics.md for full
// derivation and sourcing: same family, same category -- pure grade-difference ratio (6^n going
// up a grade, 1:3^n going down); different family, same category -- an extra flat x6 on the
// "give" side on top of whatever the grade difference already costs. Categories (raw/manufactured/
// encoded) never cross at all -- a single trader only ever deals in one.
function tradeQuantities(giveGrade, giveFamily, getGrade, getFamily) {
  let give = 1, get = 1;
  if (getGrade > giveGrade) give = Math.pow(6, getGrade - giveGrade);
  else if (getGrade < giveGrade) get = Math.pow(3, giveGrade - getGrade);
  if (giveFamily !== getFamily) give *= 6;
  return { give, get };
}

const tradeCatalogByKey = {};
((DATA.trading && DATA.trading.materialCatalog) || []).forEach(m => { tradeCatalogByKey[m.key] = m; });

// This page already has a flat held-materials map (used by materialsSummary for the plan's own
// shortfall math) -- no need for a separate lookup.
function heldCountFor(key) { return DATA.heldMaterials[key] || 0; }

function traderTypeLabel(t) {
  return t === 'raw' ? 'Raw' : t === 'manufactured' ? 'Manufactured' : t === 'encoded' ? 'Encoded' : t;
}

function tradersForType(type) {
  return ((DATA.trading && DATA.trading.traders) || []).filter(t => t.type === type);
}

function formatDistance(t) {
  return t.distanceLy == null ? '' : ` -- ${t.distanceLy.toLocaleString('en-US', { maximumFractionDigits: 1 })} ly`;
}

// Groups the trading catalog into family rows for the target's own type only (a trader never
// crosses raw/manufactured/encoded) -- preserves the catalog's own order, which the Go side
// already emits family-by-family (materialCatalogForTrading iterates materialFamilyCatalog in
// its defined order), same row/column shape as the materials page's own in-game-style grid.
function familyGroupsForType(type) {
  const order = [];
  const byName = {};
  ((DATA.trading && DATA.trading.materialCatalog) || []).forEach(m => {
    if (m.type !== type) return;
    if (!byName[m.family]) { byName[m.family] = []; order.push(m.family); }
    byName[m.family].push(m);
  });
  order.forEach(fam => byName[fam].sort((a, b) => a.grade - b.grade));
  return order.map(fam => ({ name: fam, materials: byName[fam] }));
}

// Cell classification -- color-codes each trade option by how good a deal it is:
//   red    -- this material is ITSELF needed elsewhere in the current plan (neededElsewhereMap,
//             the same aggregate the "Materials needed" cards already use) -- spending it here
//             would compete with your own plan, regardless of how good the ratio looks.
//   grey   -- you hold none of it, nothing to trade from.
//   blue   -- a cheap trade (same family, same grade or trading DOWN -- cost-per-unit <= 1) OR
//             you simply hold a large surplus (maxObtainable >= 10) -- real example that
//             motivated the second half of this rule: Encoded materials farmed at Jameson Crash
//             Site (HIP 12099 1 B) are grade 4-5 but trivially re-obtainable in bulk, so a
//             commander sitting on a big pile of one shouldn't see it flagged as "precious" just
//             because of its grade -- held QUANTITY is its own real efficiency signal, independent
//             of the ratio math.
//   yellow -- possible, but neither of the above -- a grade-up and/or cross-family trade you only
//             hold a modest amount of. Not wrong to use, just not the best option on the board.
// maxObtainable === 0 (held SOME of the material, but not enough to complete even a single
// trade -- e.g. 15 held when the trade needs 216) is functionally the same as holding none at
// all for this purpose: not a real option, so it's "empty" too, not a misleading "yellow -- costly
// but possible" when it isn't actually possible.
function classifyTradeCell(held, maxObtainable, ratioCostPerUnit, neededElsewhere) {
  if (held <= 0 || maxObtainable <= 0) return 'empty';
  if (neededElsewhere > 0) return 'red';
  if (ratioCostPerUnit <= 1 || maxObtainable >= 10) return 'blue';
  return 'yellow';
}

function tradeGridCell(m, target, neededElsewhereMap) {
  if (m.key === target.key) {
    return `<div class="trade-grid-cell trade-grid-cell-target">
      <div class="grid-cell-grade">Grade ${m.grade}</div>
      <div class="grid-cell-name">${escapeHtml(m.name)}</div>
      <div class="trade-grid-cell-label">Target</div>
    </div>`;
  }
  const held = heldCountFor(m.key);
  const { give, get } = tradeQuantities(m.grade, m.family, target.grade, target.family);
  const maxObtainable = held >= give ? Math.floor(held / give) * get : 0;
  const neededElsewhere = (neededElsewhereMap && neededElsewhereMap[m.key] && neededElsewhereMap[m.key].count) || 0;
  const cls = classifyTradeCell(held, maxObtainable, give / get, neededElsewhere);
  const title = cls === 'red'
    ? `Needed elsewhere in your plan (need ${neededElsewhere.toLocaleString('en-US')}, hold ${held.toLocaleString('en-US')}) -- trading this away could leave you short there.`
    : cls === 'empty'
    ? (held > 0
        ? `You hold ${held.toLocaleString('en-US')} ${m.name}, but a trade needs ${give.toLocaleString('en-US')} -- not enough for even one.`
        : `You don't currently hold any ${m.name}.`)
    : `Give ${give.toLocaleString('en-US')} ${m.name} to get ${get.toLocaleString('en-US')} ${target.name} -- up to ${maxObtainable.toLocaleString('en-US')} total from what you hold.`;
  return `<div class="trade-grid-cell trade-grid-cell-${cls}" title="${escapeHtml(title)}">
    <div class="grid-cell-grade">Grade ${m.grade}</div>
    <div class="grid-cell-name">${escapeHtml(m.name)}</div>
    <div class="grid-cell-count">${held ? held.toLocaleString('en-US') + ' held' : '—'}</div>
    ${maxObtainable > 0 ? `<div class="trade-grid-cell-ratio">${give.toLocaleString('en-US')} → ${get.toLocaleString('en-US')}</div><div class="trade-grid-cell-max">up to ${maxObtainable.toLocaleString('en-US')} total</div>` : ''}
  </div>`;
}

function tradeGridHtml(target, neededElsewhereMap) {
  const groups = familyGroupsForType(target.type);
  return `<div class="grid-families">${groups.map(g => `<div class="grid-family">
    <div class="grid-family-name">${escapeHtml(g.name)}</div>
    <div class="grid-family-cells">${g.materials.map(m => tradeGridCell(m, target, neededElsewhereMap)).join('')}</div>
  </div>`).join('')}</div>`;
}

function tradersSectionHtml(target) {
  const traders = tradersForType(target.type);
  return traders.length
    ? traders.map(t => `<div class="trader-row">
        <div>
          <div class="trade-candidate-name">${escapeHtml(t.station)}</div>
          <div class="trade-candidate-detail">${escapeHtml(t.system)}${formatDistance(t)} · last traded ${escapeHtml((t.lastUsedAt || '').slice(0, 10))}</div>
        </div>
        <button type="button" class="copy-btn-small trader-copy-btn" data-system="${escapeHtml(t.system)}">Copy system</button>
      </div>`).join('')

}

// The trade grid is the primary content; the nearby-traders list stays collapsed behind a button

}

// bpIndex: type -> name -> grade -> blueprint. Also a flat lookup by "type|name|grade" for the basket.
const bpIndex = {};
const bpByKey = {};
DATA.blueprints.forEach(bp => {
  bpIndex[bp.type] = bpIndex[bp.type] || {};
  bpIndex[bp.type][bp.name] = bpIndex[bp.type][bp.name] || {};
  bpIndex[bp.type][bp.name][bp.grade] = bp;
  bpByKey[`${bp.type}|${bp.name}|${bp.grade}`] = bp;
});

// Experimental effects aren't tied to a grade of the base upgrade -- indexed by type only, and
// looked up independently of which grade got picked above.
const effectIndex = {};
const effectByKey = {};
DATA.effects.forEach(ef => {
  effectIndex[ef.type] = effectIndex[ef.type] || [];
  effectIndex[ef.type].push(ef);
  effectByKey[`${ef.type}|${ef.name}`] = ef;
});

document.getElementById('subtitle').textContent =
  `${DATA.blueprints.length} real ship-module engineering blueprints (grades 1-5) plus ${DATA.effects.length} Experimental Effects, sourced from a community reference (Odyssey on-foot suit/weapon engineering isn't covered -- this project has no inventory data for that resource pool). ` +
  (DATA.hasSnapshot
    ? `Materials compared against your inventory as of ${DATA.snapshotAt.replace('T', ' ').replace('Z', '')} UTC.`
    : `No materials inventory captured yet -- open your in-game Materials screen, then re-run this tool, to see what you already have.`) +
  ' ' +
  (DATA.hasEngineerData

function loadBasket() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveBasket(basket) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(basket));
  } catch (e) { /* ignore -- storage unavailable or full, plan just won't persist across reloads */ }
}

let basket = loadBasket();

document.getElementById('addBtn').addEventListener('click', () => {
  const type = document.getElementById('pickType').value;
  const name = document.getElementById('pickName').value;
  const grade = Number(document.getElementById('pickGrade').value);
  const effect = document.getElementById('pickEffect').value || null;
  const qty = Math.max(1, Number(document.getElementById('pickQty').value) || 1);

  if (existing) {

  } else {
    basket.push({ type, name, grade, effect, qty });
  }
  saveBasket(basket);
  render();
});

function removeItem(idx) {
  basket.splice(idx, 1);
  saveBasket(basket);
  render();
}
function updateQty(idx, qty) {
  qty = Math.max(1, Number(qty) || 1);
  basket[idx].qty = qty;
  saveBasket(basket);
  render();
}
function clearBasket() {

  saveBasket(basket);
  render();
}
window.removeItem = removeItem;
window.updateQty = updateQty;
window.clearBasket = clearBasket;

function basketTable() {
  if (!basket.length) return '';

      <td>${escapeHtml(item.name)}</td>
      <td>Grade ${item.grade}</td>
      <td>${item.effect ? escapeHtml(item.effect) : '<span style="color:var(--muted-faint)">--</span>'}</td>
      <td><input type="number" class="basket-qty" min="1" value="${item.qty}" onchange="updateQty(${idx}, this.value)"></td>

      <tbody>${rows}</tbody>
    </table>

}

// Real Elite Dangerous mechanic, confirmed against community reference material: at maximum rank
// with an engineer,
// each roll at grade G deterministically contributes 100/G% progress, so grade G takes exactly G
// rolls, and you can't skip straight to a high grade -- you walk through every lower grade first.
// So the real total cost of taking one module from unmodified to grade N is the SUM, for every
// grade g from 1 to N, of that grade's per-roll ingredient cost times g (not just grade N's
// per-roll cost once). Ingredients in DATA are the per-roll cost for that one grade (confirmed
// from the vendored source, e.g. Dirty Drive Tuning grade 3 lists Chromium/Mechanical Components/
// Legacy Firmware x1 each -- that's one roll's worth, not the full grade-3 total).
function cumulativeIngredients(type, name, targetGrade) {
  const byGrade = (bpIndex[type] || {})[name] || {};
  const out = [];
  for (let g = 1; g <= targetGrade; g++) {
    const bp = byGrade[g];
    if (!bp) continue;
    bp.ingredients.forEach(ing => out.push({ key: ing.key, name: ing.name, count: ing.count * g }));
  }
  return out;
}

// Shared by materialsSummary (the visible cards) and the trade grid (which needs to know, for
// ANY material in the same category as whatever's being traded FOR -- not just the one currently
// short -- whether the plan already needs it elsewhere too, see tradeGridCell's "red" case).
function computeNeededMap() {
  const needed = {}; // key -> {name, count}
  basket.forEach(item => {
    cumulativeIngredients(item.type, item.name, item.grade).forEach(ing => {
      if (!needed[ing.key]) needed[ing.key] = { name: ing.name, count: 0 };
      needed[ing.key].count += ing.count * item.qty;
    });
    if (item.effect) {
      const ef = effectByKey[`${item.type}|${item.effect}`];
      if (ef) {
        ef.ingredients.forEach(ing => {
          if (!needed[ing.key]) needed[ing.key] = { name: ing.name, count: 0 };
          needed[ing.key].count += ing.count * item.qty;
        });
      }
    }
  });
  return needed;
}

function materialsSummary() {
  const needed = computeNeededMap();
  if (!Object.keys(needed).length) return '';
  const withKeys = Object.entries(needed).map(([key, v]) => ({ key, ...v }));
  withKeys.sort((a, b) => {
    const shortA = a.count - (DATA.heldMaterials[a.key] || 0);
    const shortB = b.count - (DATA.heldMaterials[b.key] || 0);
    return shortB - shortA || a.name.localeCompare(b.name);
  });
  const cards = withKeys.map(m => {
    const held = DATA.heldMaterials[m.key] || 0;
    const short = m.count - held;
    const cls = short > 0 ? 'need-short' : 'need-met';
    const status = !DATA.hasSnapshot
      ? 'No inventory captured yet'
      : short > 0 ? `Short by ${short.toLocaleString('en-US')}` : 'You have enough';
    // Only short cards get the trade trigger (met ones don't need it), and only if the material
    // is actually tradeable (belongs to a named family -- Guardian/Thargoid materials aren't
    // tradeable at any Material Trader, see docs/MaterialTraderMechanics.md).
    const tradeable = short > 0 && DATA.hasSnapshot && !!tradeCatalogByKey[m.key];
    const tradeAttrs = tradeable ? ` data-material-key="${escapeHtml(m.key)}" data-short="${short}" title="Click to see trade options to cover this shortfall"` : '';
    return `<div class="need-card ${cls}${tradeable ? ' trade-trigger' : ''}"${tradeAttrs}>
      <div class="need-name">${escapeHtml(m.name)}</div>
      <div class="need-amounts">${held.toLocaleString('en-US')} / ${m.count.toLocaleString('en-US')}</div>
      <div class="need-status">${status}</div>
    </div>`;
  }).join('');
  return `<div class="section-block">
    <div class="section-title">Materials needed <span class="section-sub">held / needed, across your whole plan</span></div>
    <div class="need-grid">${cards}</div>
    <p class="caveat">Assumes maximum rank with each engineer: grade N takes N rolls (1 for grade 1, up to 5 for grade 5), and reaching grade N means rolling every lower grade first too -- so a grade 5 upgrade totals 1+2+3+4+5 = 15 rolls' worth of materials, not just 5. If your rank with an engineer is below what a grade needs, real rolls (and materials) required will be higher and less predictable than shown here. Experimental Effects are a single roll regardless of grade.</p>
  </div>`;
}

function engineerChip(e) {
  const cls = e.progress === 'Unlocked' ? 'engineer-unlocked' : e.progress === 'Invited' ? 'engineer-invited' : 'engineer-unknown';
  const label = e.progress === 'Unlocked' && e.rank ? `${e.name} (Rank ${e.rank})` : e.progress ? `${e.name} (${e.progress})` : `${e.name} (no record)`;
  if (e.system) {
    return `<span class="engineer-chip ${cls} engineer-chip-clickable" data-system="${escapeHtml(e.system)}" data-label="${escapeHtml(label)}" title="Click to copy &quot;${escapeHtml(e.system)}&quot; -- paste into the galaxy map to plot a route">${escapeHtml(label)}</span>`;
  }
  return `<span class="engineer-chip ${cls}">${escapeHtml(label)}</span>`;
}

// Copies via the modern Clipboard API when available, falling back to the classic hidden-
// textarea + execCommand trick -- this page can be opened directly as a file:// document (no
// server, no HTTPS), where navigator.clipboard isn't guaranteed to be available.
//
// Real bug this fixed: execCommand('copy') needs the source element to actually have browser
// FOCUS, not just a text selection, in enough real browsers that skipping ta.focus() here made
// the fallback silently do nothing whenever the Clipboard API path also failed -- while the UI
// still unconditionally claimed success either way, so a real failure looked like a broken/
// rejected paste rather than the copy never having happened. Now resolves to whether it actually
// worked, and the caller reports the real outcome.
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* best effort */ }
  document.body.removeChild(ta);
  return ok;
}

document.getElementById('planSections').addEventListener('click', e => {
  const chip = e.target.closest('.engineer-chip-clickable');
  if (!chip) return;
  const system = chip.dataset.system;
  const label = chip.dataset.label;
  copyToClipboard(system).then(ok => {

function engineerGroupHtml(title, engineers) {
  const hasUnlocked = engineers.some(e => e.progress === 'Unlocked');

function engineersSummary() {
  const seenBp = new Set();
  const seenEffect = new Set();
  const groups = [];
  basket.forEach(item => {
    const bp = bpByKey[`${item.type}|${item.name}|${item.grade}`];
    if (bp) {
      const k = `${bp.type}|${bp.name}|${bp.grade}`;
      if (!seenBp.has(k)) {
        seenBp.add(k);
        groups.push(engineerGroupHtml(`${bp.type} -- ${bp.name} (Grade ${bp.grade})`, bp.engineers));
      }
    }
    if (item.effect) {
      const ef = effectByKey[`${item.type}|${item.effect}`];
      if (ef) {
        const k = `${ef.type}|${ef.name}`;
        if (!seenEffect.has(k)) {
          seenEffect.add(k);
          groups.push(engineerGroupHtml(`${ef.type} -- ${ef.name} (Experimental Effect)`, ef.engineers));
        }
      }
    }
  });
  if (!groups.length) return '';
  return `<div class="section-block">
    <div class="section-title">Engineers <span class="section-sub">who can give you each upgrade in your plan</span></div>
    ${groups.join('')}

  </div>`;
}

    document.getElementById('planSections').innerHTML =
      `<div class="empty-note"><div class="empty-note-icon">⚙️</div>Your plan is empty -- pick a module and upgrade above, then "Add to plan".</div>`;
    return;

  document.getElementById('planSections').innerHTML = basketTable() + materialsSummary() + engineersSummary();
}

render();

// Manual light/dark override -- CSS already auto-follows the OS via
// @media(prefers-color-scheme), but that gives no way to actually compare both from inside the
// page. Stamping data-theme on <html> and pairing it with the :root[data-theme=...] blocks above (each with
// higher specificity than the plain :root a media query targets) lets an explicit choice win
// regardless of OS preference, in either direction. The tiny inline script in <head> applies any
// saved choice before first paint, so there's no flash of the wrong theme on load.
function currentTheme() {
  const forced = document.documentElement.getAttribute('data-theme');
  if (forced === 'light' || forced === 'dark') return forced;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function updateThemeToggleLabel() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  // Icon-only, shows the CURRENTLY ACTIVE theme (sun when light, moon when dark) -- a state
  // indicator you click to flip, same idea as a physical light switch showing its own position.
  const dark = currentTheme() === 'dark';
  btn.textContent = dark ? '🌙' : '☀️';
  btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
// Carries an EXPLICIT theme choice into the other pages' nav links (as a ?theme= query param)
// so it actually persists when clicking around -- these are separate file:// documents, and
// browsers don't reliably share localStorage between distinct local files (some isolate storage
// per exact file path), so localStorage alone silently failed to survive navigation on its own,
// and the theme choice needs to persist across pages. Only rewrites hrefs once a real choice has been
// made (theme is truthy) -- before that, nav links stay plain so OS/media-query preference keeps
// being picked up fresh on every page, same as before this existed.
function propagateThemeToNavLinks(theme) {
  document.querySelectorAll('.page-nav-link[href]').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.setAttribute('href', theme ? base + '?theme=' + theme : base);
  });
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('standalone_theme', theme); } catch (e) { /* storage unavailable */ }
  updateThemeToggleLabel();
  propagateThemeToNavLinks(theme);
}
const themeToggleBtn = document.getElementById('themeToggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
}
updateThemeToggleLabel();
propagateThemeToNavLinks(document.documentElement.getAttribute('data-theme'));
</script>
</body>
</html>
