<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=(q==='light'||q==='dark')?q:localStorage.getItem('standalone_theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);if(q)localStorage.setItem('standalone_theme',t);}}catch(e){}})();</script>
<title>edjournalatlas -- full journal search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: light dark;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --transition: 160ms ease;
  --bg: #f9f9f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --muted-faint: #898781;
  --border: #e1e0d9; --border-strong: #c3c2b7; --accent: #2a78d6; --accent-weak: #e6f0fc;
  --good: #0ca30c; --good-bg: #e5f7e5; --warning: #b5710a; --warning-bg: #fdf1de;
  --bonus-bg: #fdf1d3; --bonus-text: #7a5a00;
  --notable-bg: #efe6fb; --notable-text: #6b3fb0;
  --bad-bg: #fbe2df; --bad-text: #c22f2f;
  --shadow: 0 1px 2px rgba(20,18,12,0.06), 0 6px 16px -8px rgba(20,18,12,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0d12; --panel: #15181d; --text: #f2f3f5; --muted: #b7bcc4; --muted-faint: #7c828b;
    --border: #262a31; --border-strong: #343a43; --accent: #3987e5; --accent-weak: #17233a;
    --good: #3ecf3e; --good-bg: #12291a; --warning: #e0a53c; --warning-bg: #2e2312;
    --bonus-bg: #3d3110; --bonus-text: #f0c766;
    --notable-bg: #2c2140; --notable-text: #caa9f7;
    --bad-bg: #3a1f1f; --bad-text: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 8px 20px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.045);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --transition: 160ms ease;
  --bg: #f9f9f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --muted-faint: #898781;
  --border: #e1e0d9; --border-strong: #c3c2b7; --accent: #2a78d6; --accent-weak: #e6f0fc;
  --good: #0ca30c; --good-bg: #e5f7e5; --warning: #b5710a; --warning-bg: #fdf1de;
  --bonus-bg: #fdf1d3; --bonus-text: #7a5a00;
  --notable-bg: #efe6fb; --notable-text: #6b3fb0;
  --bad-bg: #fbe2df; --bad-text: #c22f2f;
  --shadow: 0 1px 2px rgba(20,18,12,0.06), 0 6px 16px -8px rgba(20,18,12,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d12; --panel: #15181d; --text: #f2f3f5; --muted: #b7bcc4; --muted-faint: #7c828b;
  --border: #262a31; --border-strong: #343a43; --accent: #3987e5; --accent-weak: #17233a;
  --good: #3ecf3e; --good-bg: #12291a; --warning: #e0a53c; --warning-bg: #2e2312;
  --bonus-bg: #3d3110; --bonus-text: #f0c766;
  --notable-bg: #2c2140; --notable-text: #caa9f7;
  --bad-bg: #3a1f1f; --bad-text: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 8px 20px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.045);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); padding: var(--space-5); font-variant-numeric: tabular-nums; }
.page-nav { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.page-nav-link { font-size: 0.85rem; color: var(--muted); text-decoration: none; padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-pill); border: 1px solid var(--border); transition: border-color var(--transition), color var(--transition); }
.page-nav-link:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.page-nav-link.page-nav-active { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); font-weight: 600;
  box-shadow: 0 2px 10px -4px color-mix(in srgb, var(--accent) 50%, transparent); }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 var(--space-5); }
.controls { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-4);
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); box-shadow: var(--shadow); }
input[type=text], select { background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-size: 0.9rem;
  transition: border-color var(--transition), box-shadow var(--transition); }
input[type=text]:hover, select:hover { border-color: var(--border-strong); }
input[type=text]:focus, select:focus { border-color: var(--accent); outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
#searchInput { width: 340px; }
.result-count { color: var(--muted); font-size: 0.78rem; margin-bottom: var(--space-3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.event-row { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  margin-bottom: var(--space-2); box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
  transition: border-color var(--transition), transform var(--transition); }
.event-row:hover { border-color: var(--border-strong); }
.event-row.open { border-color: var(--accent); box-shadow: var(--shadow), inset 3px 0 0 var(--accent); }
.event-row-head { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-2) var(--space-3);
  flex-wrap: wrap; }
.event-time { color: var(--muted-faint); font-size: 0.76rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.event-type { font-weight: 700; letter-spacing: -0.005em; }
.event-system { color: var(--muted); font-size: 0.85rem; text-decoration: none; border-bottom: 1px dotted transparent; }
.event-system:hover { color: var(--accent); border-bottom-color: var(--accent); }
.event-body { color: var(--muted-faint); font-size: 0.78rem; }
.event-raw { display: none; margin: 0; padding: var(--space-3); border-top: 1px solid var(--border);
  background: var(--bg); font-size: 0.78rem; white-space: pre-wrap; word-break: break-word; }
.event-row.open .event-raw { display: block; }
.empty-note { color: var(--muted); padding: var(--space-6) var(--space-4); text-align: center;
  border: 1px dashed var(--border); border-radius: var(--radius-md); }
.empty-note-icon { font-size: 1.9rem; margin-bottom: var(--space-2); opacity: 0.75; }
a { color: var(--accent); }
a:focus-visible, input:focus-visible, select:focus-visible, .event-row:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm);
}

/* Deliberately NOT a .page-nav-link -- owner: "the mode button shouldnt be there it looks like a
   different page buton" -- a nav-styled pill read as "one more page to visit," not a settings
   control. Fixed to the actual viewport corner (not just the top of the document) so it reads as
   persistent app chrome, closer to a game HUD's settings icon than another link in a row. */
.theme-toggle { position: fixed; top: var(--space-4); right: var(--space-4); z-index: 20;
  display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
  cursor: pointer; font-size: 1.05rem; line-height: 1; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius-pill); box-shadow: var(--shadow);
  transition: border-color var(--transition), transform var(--transition); }
.theme-toggle:hover { border-color: var(--accent); transform: translateY(-1px); }
</style>
</head>
<body>

<nav class="page-nav">
  <a class="page-nav-link" href="standalone_viewer.html">🗺️ Systems</a>
  <a class="page-nav-link page-nav-active" href="standalone_events.html">🔍 Journal search</a>
  <a class="page-nav-link" href="standalone_summary.html">📊 Recap</a>
  <a class="page-nav-link" href="standalone_materials.html">🧪 Materials</a>
  <a class="page-nav-link" href="standalone_engineering.html">⚙️ Engineering planner</a>
  <a class="page-nav-link" href="standalone_shipyard.html">🚀 Shipyard</a>
</nav>
<button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch color theme"></button>

<h1>standalone -- full journal search</h1>
<p class="subtitle" id="subtitle"></p>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search event type, system, or raw JSON text...">
  <select id="eventTypeSelect"><option value="">All event types</option></select>
  <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;">
    <input type="checkbox" id="sortAscInput"> Oldest first
  </label>
</div>

<div class="result-count" id="resultCount"></div>
<div id="results"></div>

<script id="event-data" type="application/json">__DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('event-data').textContent);
const RESULT_CAP = 300;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Event-type counts, most frequent first -- lets the dropdown surface what's actually common in
// THIS commander's own journal rather than a fixed alphabetical list of 170+ names to scroll.
const typeCounts = new Map();
for (const e of DATA.events) typeCounts.set(e.event, (typeCounts.get(e.event) || 0) + 1);
const sortedTypes = [...typeCounts.entries()].sort((a, b) => b[1] - a[1]);
document.getElementById('eventTypeSelect').innerHTML += sortedTypes
  .map(([type, n]) => `<option value="${escapeHtml(type)}">${escapeHtml(type)} (${n.toLocaleString('en-US')})</option>`)
  .join('');

document.getElementById('subtitle').textContent =
  `Generated ${DATA.generatedAt} — ${DATA.events.length.toLocaleString('en-US')} journal events, every event type, not just exploration-relevant ones.`;

// standalone_viewer.html's "Journal ↗" button links here as "#q=<system name>" -- lets "show me
// the raw journal for this system" be a real link between the two pages instead of a dead end
// (the search page otherwise has no way to know why someone arrived at it). Read once at load,
// same reasoning as viewer_template.html's systemFromHash: this page never rewrites its own
// hash, so there's nothing for a hashchange listener to react to.
const hashMatch = location.hash.match(/q=([^&]+)/);
if (hashMatch) {
  document.getElementById('searchInput').value = decodeURIComponent(hashMatch[1]);
}

let openKeys = new Set();

function render() {
  const needle = document.getElementById('searchInput').value.trim().toLowerCase();
  const typeFilter = document.getElementById('eventTypeSelect').value;
  const asc = document.getElementById('sortAscInput').checked;

  let filtered = DATA.events.filter(e => {
    if (typeFilter && e.event !== typeFilter) return false;
    if (!needle) return true;
    return (
      e.event.toLowerCase().includes(needle) ||
      (e.systemName && e.systemName.toLowerCase().includes(needle)) ||
      e.raw.toLowerCase().includes(needle)
    );
  });

  document.getElementById('resultCount').textContent = filtered.length
    ? `${filtered.length.toLocaleString('en-US')} match${filtered.length === 1 ? '' : 'es'}${filtered.length > RESULT_CAP ? ` (showing first ${RESULT_CAP} -- refine your search to narrow it down)` : ''}`
    : '';

  if (!asc) filtered = filtered.slice().reverse(); // DATA.events is already timestamp-ascending

  const shown = filtered.slice(0, RESULT_CAP);
  const results = document.getElementById('results');
  if (!shown.length) {
    // Same reasoning as the systems viewer's empty state: "no journal captured at all" and
    // "your search matched nothing" are different problems with different fixes.
    results.innerHTML = `<div class="empty-note"><div class="empty-note-icon">🔍</div>${DATA.events.length ? 'No matching events.' : 'No journal events captured yet -- play some Elite Dangerous, then run this again.'}</div>`;
    return;
  }
  results.innerHTML = shown.map((e, i) => {
    const key = `${e.timestamp}::${i}`;
    const isOpen = openKeys.has(key);
    let pretty = e.raw;
    try { pretty = JSON.stringify(JSON.parse(e.raw), null, 2); } catch (err) { /* show raw as-is */ }
    return `<div class="event-row${isOpen ? ' open' : ''}" data-key="${escapeHtml(key)}" tabindex="0">
      <div class="event-row-head">
        <span class="event-time">${escapeHtml(e.timestamp.replace('T', ' ').replace('Z', ''))}</span>
        <span class="event-type">${escapeHtml(e.event)}</span>
        ${e.systemName ? `<a class="event-system" href="standalone_viewer.html#system=${encodeURIComponent(e.systemName)}" target="_blank" rel="noopener" title="Open this system in the systems viewer">${escapeHtml(e.systemName)}</a>` : ''}
        ${e.bodyId != null ? `<span class="event-body">BodyID ${e.bodyId}</span>` : ''}
      </div>
      <pre class="event-raw">${escapeHtml(pretty)}</pre>
    </div>`;
  }).join('');

  results.querySelectorAll('.event-row').forEach(row => {
    const toggle = () => {
      const key = row.getAttribute('data-key');
      if (openKeys.has(key)) openKeys.delete(key); else openKeys.add(key);
      render();
    };
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
  // Without this, clicking the system link would also bubble up and toggle the row open/closed
  // in the SAME tab it's navigating away from -- harmless but sloppy, since the link already
  // opens the viewer in its own new tab.
  results.querySelectorAll('.event-system').forEach(a => {
    a.addEventListener('click', e => e.stopPropagation());
  });
}

let searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(render, 150);
});
document.getElementById('eventTypeSelect').addEventListener('change', render);
document.getElementById('sortAscInput').addEventListener('change', render);

render();

// Manual light/dark override -- CSS already auto-follows the OS via
// @media(prefers-color-scheme), but that gives no way to actually compare both from inside the
// page (real owner confusion: "there doesn't seem to be a light/dark mode"). Stamping
// data-theme on <html> and pairing it with the :root[data-theme=...] blocks above (each with
// higher specificity than the plain :root a media query targets) lets an explicit choice win
// regardless of OS preference, in either direction. The tiny inline script in <head> applies any
// saved choice before first paint, so there's no flash of the wrong theme on load.
function currentTheme() {
  const forced = document.documentElement.getAttribute('data-theme');
  if (forced === 'light' || forced === 'dark') return forced;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function updateThemeToggleLabel() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  // Icon-only, shows the CURRENTLY ACTIVE theme (sun when light, moon when dark) -- a state
  // indicator you click to flip, same idea as a physical light switch showing its own position.
  const dark = currentTheme() === 'dark';
  btn.textContent = dark ? '🌙' : '☀️';
  btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
// Carries an EXPLICIT theme choice into the other pages' nav links (as a ?theme= query param)
// so it actually persists when clicking around -- these are separate file:// documents, and
// browsers don't reliably share localStorage between distinct local files (some isolate storage
// per exact file path), so localStorage alone silently failed to survive navigation (real owner
// report: "mode should persist across pages"). Only rewrites hrefs once a real choice has been
// made (theme is truthy) -- before that, nav links stay plain so OS/media-query preference keeps
// being picked up fresh on every page, same as before this existed.
function propagateThemeToNavLinks(theme) {
  document.querySelectorAll('.page-nav-link[href]').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.setAttribute('href', theme ? base + '?theme=' + theme : base);
  });
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('standalone_theme', theme); } catch (e) { /* storage unavailable */ }
  updateThemeToggleLabel();
  propagateThemeToNavLinks(theme);
}
const themeToggleBtn = document.getElementById('themeToggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
}
updateThemeToggleLabel();
propagateThemeToNavLinks(document.documentElement.getAttribute('data-theme'));
</script>
</body>
</html>
