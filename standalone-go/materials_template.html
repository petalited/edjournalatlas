<script id="materials-data" type="application/json">__DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('materials-data').textContent);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Copies via the modern Clipboard API when available, falling back to the classic hidden-
// textarea + execCommand trick (already fixed for the focus bug elsewhere in this project --
// execCommand needs the source element to actually have browser FOCUS, not just a text
// selection, or it silently no-ops in enough real browsers) -- ported verbatim from
// engineering_template.html, the same real bug already found and fixed there.
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* best effort */ }
  document.body.removeChild(ta);
  return ok;
}

// Trade calculator -- click a material you're short on to see what you could trade at a Material
// Trader instead. Ratio math and family/type rules are the real Material Trader mechanic, see
// docs/MaterialTraderMechanics.md for full
// derivation and sourcing: same family, same category -- pure grade-difference ratio (6^n going
// up a grade, 1:3^n going down); different family, same category -- an extra flat x6 on the
// "give" side on top of whatever the grade difference already costs. Categories (raw/manufactured/
// encoded) never cross at all -- a single trader only ever deals in one.
function tradeQuantities(giveGrade, giveFamily, getGrade, getFamily) {
  let give = 1, get = 1;
  if (getGrade > giveGrade) give = Math.pow(6, getGrade - giveGrade);
  else if (getGrade < giveGrade) get = Math.pow(3, giveGrade - getGrade);
  if (giveFamily !== getFamily) give *= 6;
  return { give, get };
}

const tradeCatalogByKey = {};
((DATA.trading && DATA.trading.materialCatalog) || []).forEach(m => { tradeCatalogByKey[m.key] = m; });

// This page already knows exactly what's held (DATA.raw/manufactured/encoded, the same arrays
// the list view renders) -- no need to go back to a raw snapshot.
const heldByKey = {};
['raw', 'manufactured', 'encoded'].forEach(cat => (DATA[cat] || []).forEach(m => { heldByKey[m.key] = m.count; }));
function heldCountFor(key) { return heldByKey[key] || 0; }

function traderTypeLabel(t) {
  return t === 'raw' ? 'Raw' : t === 'manufactured' ? 'Manufactured' : t === 'encoded' ? 'Encoded' : t;
}

function tradersForType(type) {
  return ((DATA.trading && DATA.trading.traders) || []).filter(t => t.type === type);
}

function formatDistance(t) {
  return t.distanceLy == null ? '' : ` -- ${t.distanceLy.toLocaleString('en-US', { maximumFractionDigits: 1 })} ly`;
}

// Groups the trading catalog into family rows for the target's own type only (a trader never
// crosses raw/manufactured/encoded) -- preserves the catalog's own order, which the Go side
// already emits family-by-family, same row/column shape as this page's own "Grid (in-game
// families)" view.
function familyGroupsForType(type) {
  const order = [];
  const byName = {};
  ((DATA.trading && DATA.trading.materialCatalog) || []).forEach(m => {
    if (m.type !== type) return;
    if (!byName[m.family]) { byName[m.family] = []; order.push(m.family); }
    byName[m.family].push(m);
  });
  order.forEach(fam => byName[fam].sort((a, b) => a.grade - b.grade));
  return order.map(fam => ({ name: fam, materials: byName[fam] }));
}

// Cell classification -- color-codes each trade option: red for materials needed elsewhere in an
// active plan, yellow for inefficient trades, blue for efficient/plentiful ones. This page has no
// "plan" concept (that's the engineering planner's job), so red never triggers here -- always
// passed an empty needed-elsewhere map, kept as a parameter anyway so the two pages' logic stays
// identical rather than silently diverging.
//   blue   -- a cheap trade (same family, same grade or trading DOWN -- cost-per-unit <= 1) OR
//             you simply hold a large surplus (maxObtainable >= 10) -- real example: Encoded
//             materials farmed at Jameson Crash Site (HIP 12099 1 B) are grade 4-5 but trivially
//             re-obtainable in bulk, so a commander sitting on a big pile of one shouldn't see it
//             flagged as "precious" just because of its grade -- held QUANTITY is its own real
//             efficiency signal, independent of the ratio math.
//   yellow -- possible, but neither of the above.
//   empty  -- held none, or held some but not enough to complete even a single trade.
function classifyTradeCell(held, maxObtainable, ratioCostPerUnit, neededElsewhere) {
  if (held <= 0 || maxObtainable <= 0) return 'empty';
  if (neededElsewhere > 0) return 'red';
  if (ratioCostPerUnit <= 1 || maxObtainable >= 10) return 'blue';
  return 'yellow';
}

function tradeGridCell(m, target) {
  if (m.key === target.key) {
    return `<div class="trade-grid-cell trade-grid-cell-target">
      <div class="grid-cell-grade">Grade ${m.grade}</div>
      <div class="grid-cell-name">${escapeHtml(m.name)}</div>
      <div class="trade-grid-cell-label">Target</div>
    </div>`;
  }
  const held = heldCountFor(m.key);
  const { give, get } = tradeQuantities(m.grade, m.family, target.grade, target.family);
  const maxObtainable = held >= give ? Math.floor(held / give) * get : 0;
  const cls = classifyTradeCell(held, maxObtainable, give / get, 0);
  const title = cls === 'empty'
    ? (held > 0
        ? `You hold ${held.toLocaleString('en-US')} ${m.name}, but a trade needs ${give.toLocaleString('en-US')} -- not enough for even one.`
        : `You don't currently hold any ${m.name}.`)
    : `Give ${give.toLocaleString('en-US')} ${m.name} to get ${get.toLocaleString('en-US')} ${target.name} -- up to ${maxObtainable.toLocaleString('en-US')} total from what you hold.`;
  return `<div class="trade-grid-cell trade-grid-cell-${cls}" title="${escapeHtml(title)}">
    <div class="grid-cell-grade">Grade ${m.grade}</div>
    <div class="grid-cell-name">${escapeHtml(m.name)}</div>
    <div class="grid-cell-count">${held ? held.toLocaleString('en-US') + ' held' : '—'}</div>
    ${maxObtainable > 0 ? `<div class="trade-grid-cell-ratio">${give.toLocaleString('en-US')} → ${get.toLocaleString('en-US')}</div><div class="trade-grid-cell-max">up to ${maxObtainable.toLocaleString('en-US')} total</div>` : ''}
  </div>`;
}

function tradeGridHtml(target) {
  const groups = familyGroupsForType(target.type);
  return `<div class="grid-families">${groups.map(g => `<div class="grid-family">
    <div class="grid-family-name">${escapeHtml(g.name)}</div>
    <div class="grid-family-cells">${g.materials.map(m => tradeGridCell(m, target)).join('')}</div>
  </div>`).join('')}</div>`;
}

function tradersSectionHtml(target) {
  const traders = tradersForType(target.type);
  return traders.length
    ? traders.map(t => `<div class="trader-row">
        <div>
          <div class="trade-candidate-name">${escapeHtml(t.station)}</div>
          <div class="trade-candidate-detail">${escapeHtml(t.system)}${formatDistance(t)} · last traded ${escapeHtml((t.lastUsedAt || '').slice(0, 10))}</div>
        </div>
        <button type="button" class="copy-btn-small trader-copy-btn" data-system="${escapeHtml(t.system)}">Copy system</button>
      </div>`).join('')
    : `<p class="empty-note">No known ${traderTypeLabel(target.type).toLowerCase()} material trader in your journal history yet -- visit one and complete any trade there to have it remembered here.</p>`;
}

// The trade grid is the primary content; the nearby-traders list stays collapsed behind a button.
function tradeModalHtml(target) {
  return `
    <button type="button" class="trade-show-traders-btn" id="tradeShowTradersBtn">📍 Show nearby ${traderTypeLabel(target.type)} traders</button>
    <div id="tradeTradersSection" hidden>
      <div class="trade-section-title">Nearest known ${traderTypeLabel(target.type)} trader${DATA.trading && DATA.trading.currentSystem ? ` (from ${escapeHtml(DATA.trading.currentSystem)})` : ''}</div>
      ${tradersSectionHtml(target)}
    </div>
    <div class="trade-legend">
      <span class="trade-legend-item"><span class="trade-legend-swatch trade-legend-swatch-blue"></span>Efficient or plentiful</span>
      <span class="trade-legend-item"><span class="trade-legend-swatch trade-legend-swatch-yellow"></span>Costly but possible</span>
    </div>
    ${tradeGridHtml(target)}
  `;
}

let currentTradeTarget = null;

function openTradeModal(targetKey) {
  const target = tradeCatalogByKey[targetKey];
  if (!target) return;
  currentTradeTarget = target;
  document.getElementById('tradeModalTitle').textContent = `🔄 Trade for ${target.name}`;
  document.getElementById('tradeModalSub').textContent = `Grade ${target.grade} · ${target.family}`;
  document.getElementById('tradeModalBody').innerHTML = tradeModalHtml(target);
  document.getElementById('tradeModalOverlay').hidden = false;
}
function closeTradeModal() {
  document.getElementById('tradeModalOverlay').hidden = true;
}
document.getElementById('tradeModalClose').addEventListener('click', closeTradeModal);
document.getElementById('tradeModalOverlay').addEventListener('click', e => {
  if (e.target.id === 'tradeModalOverlay') closeTradeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTradeModal(); });
document.getElementById('tradeModalBody').addEventListener('click', e => {
  const showBtn = e.target.closest('#tradeShowTradersBtn');
  if (showBtn) {
    const section = document.getElementById('tradeTradersSection');
    section.hidden = !section.hidden;
    const label = currentTradeTarget ? traderTypeLabel(currentTradeTarget.type) : '';
    showBtn.textContent = section.hidden ? `📍 Show nearby ${label} traders` : `📍 Hide nearby traders`;
    return;
  }
  const btn = e.target.closest('.trader-copy-btn');
  if (!btn) return;
  copyToClipboard(btn.dataset.system).then(ok => {
    const original = btn.textContent;
    btn.textContent = ok ? '✓ Copied' : '✗ Failed';
    btn.classList.add(ok ? 'copied' : 'copy-failed');
    setTimeout(() => { btn.textContent = original; btn.classList.remove(ok ? 'copied' : 'copy-failed'); }, ok ? 1200 : 2500);
  });
});
document.getElementById('sections').addEventListener('click', e => {
  const trigger = e.target.closest('.trade-trigger');
  if (!trigger || !trigger.dataset.materialKey) return;
  openTradeModal(trigger.dataset.materialKey);
});

document.getElementById('subtitle').textContent = DATA.hasSnapshot
  ? `Generated ${DATA.generatedAt} -- inventory as of ${DATA.snapshotAt.replace('T', ' ').replace('Z', '')} UTC, the last time the game reported your full materials to the journal (this happens automatically each time you log in -- log in again in-game, then re-run this tool, to refresh).`
  : `Generated ${DATA.generatedAt}.`;

let filterText = '';
let sortKey = 'count';
let viewMode = 'grid';

const CATEGORIES = [
  { key: 'raw', title: 'Raw', sub: 'Elements mined/scooped from planetary surfaces and asteroids' },
  { key: 'manufactured', title: 'Manufactured', sub: 'Salvaged components and commodities' },
  { key: 'encoded', title: 'Encoded', sub: 'Data recovered from scans and signal sources' },
];

function filteredSorted(list) {
  const needle = filterText.trim().toLowerCase();
  let out = needle ? list.filter(m => m.name.toLowerCase().includes(needle)) : list.slice();
  if (sortKey === 'name') {
    out.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortKey === 'grade') {
    out.sort((a, b) => (b.grade || 0) - (a.grade || 0) || b.count - a.count);
  } else {
    out.sort((a, b) => b.count - a.count);
  }
  return out;
}

function usageBadge(m) {
  if (!m.usage) return '';
  const bpEntries = Object.entries(m.usage.blueprints).sort((a, b) => b[1] - a[1]);
  const bpList = bpEntries.map(([bp, n]) => `${escapeHtml(bp)}${n > 1 ? ` (${n}x)` : ''}`).join(', ');
  return `<div class="material-usage" title="Total consumed across your real engineering history">🔧 used ${m.usage.totalUsed.toLocaleString('en-US')}x in engineering</div>
    <div class="material-usage-detail">${bpList}</div>`;
}

function gradeBadge(m) {
  if (!m.grade) return '';
  return `<span class="material-grade material-grade-${m.grade}" title="Grade ${m.grade} material">G${m.grade}</span>`;
}

function materialCard(m) {
  // Only tradeable if it belongs to a named family (see materialCatalogForTrading, Go side) --
  // Guardian/Thargoid materials aren't tradeable at any Material Trader (verified,
  // docs/MaterialTraderMechanics.md), so no trigger for those.
  const tradeable = !!tradeCatalogByKey[m.key];
  return `<div class="material-card${tradeable ? ' trade-trigger' : ''}"${tradeable ? ` data-material-key="${escapeHtml(m.key)}" title="Click to see trade options for ${escapeHtml(m.name)}"` : ''}>
    <div class="material-card-head">
      <div class="material-name">${escapeHtml(m.name)}</div>
      ${gradeBadge(m)}
    </div>
    <div class="material-count">${m.count.toLocaleString('en-US')}</div>
    ${usageBadge(m)}
  </div>`;
}

function renderList() {
  const sections = CATEGORIES.map(cat => {
    const list = filteredSorted(DATA[cat.key]);
    const totalTypes = DATA[cat.key].length;
    const totalUnits = DATA[cat.key].reduce((s, m) => s + m.count, 0);
    if (!list.length) {
      return `<div class="section-block">
        <div class="section-title">${cat.title} <span class="section-sub">${cat.sub}</span></div>
        <div class="empty-note">No ${cat.title.toLowerCase()} materials match your search.</div>
      </div>`;
    }
    return `<div class="section-block">
      <div class="section-title">${cat.title}
        <span class="section-sub">${cat.sub} -- ${totalTypes} type${totalTypes === 1 ? '' : 's'}, ${totalUnits.toLocaleString('en-US')} units held</span>
      </div>
      <div class="material-grid">${list.map(materialCard).join('')}</div>
    </div>`;
  }).join('');

  document.getElementById('sections').innerHTML = sections;
}

function gridCell(cell) {
  const usage = cell.usage
    ? `<div class="grid-cell-usage" title="Total consumed across your real engineering history">🔧 ${cell.usage.totalUsed.toLocaleString('en-US')}x</div>`
    : '';
  // Every real grade slot in a family is tradeable (see materialCard's comment) -- unlike the
  // list view, the grid always has a key here since it's built straight from
  // materialFamilyCatalog, so no tradeable-check needed.
  return `<div class="grid-cell trade-trigger ${cell.held ? 'grid-cell-held' : 'grid-cell-empty'}" data-material-key="${escapeHtml(cell.key)}" title="Click to see trade options for ${escapeHtml(cell.name)}">
    <div class="grid-cell-grade">Grade ${cell.grade}</div>
    <div class="grid-cell-name">${escapeHtml(cell.name)}</div>
    <div class="grid-cell-count">${cell.held ? cell.count.toLocaleString('en-US') : '—'}</div>
    ${usage}
  </div>`;
}

function gridFamilyRow(fam) {
  return `<div class="grid-family">
    <div class="grid-family-name">${escapeHtml(fam.name)}</div>
    <div class="grid-family-cells">${fam.cells.map(gridCell).join('')}</div>
  </div>`;
}

// The grid groups materials into the same named families (Capacitors, Encoded Firmware,
// "Category 1"-"Category 7" for Raw, ...) the game itself uses for Material Trader trade lines
// and the community reference data this project's grades come from -- one column per grade,
// filled in with what you actually hold, empty where you don't, so it shows the real shape of
// each family rather than just a flat pile of whatever's currently in the inventory.
function renderGrid() {
  const familySections = CATEGORIES.map(cat => {
    const families = DATA.grid[cat.key] || [];
    if (!families.length) return '';
    const held = families.reduce((s, f) => s + f.cells.filter(c => c.held).length, 0);
    const total = families.reduce((s, f) => s + f.cells.length, 0);
    return `<div class="section-block">
      <div class="section-title">${cat.title}
        <span class="section-sub">${cat.sub} -- ${held} of ${total} grades held</span>
      </div>
      <div class="grid-families">${families.map(gridFamilyRow).join('')}</div>
    </div>`;
  }).join('');

  // Guardian/Thargoid/Unknown-* materials don't belong to a named family -- shown separately
  // rather than silently dropped from the grid view.
  const otherItems = CATEGORIES.flatMap(cat => DATA[cat.key].filter(m => !m.family));
  const otherSection = otherItems.length ? `<div class="section-block">
      <div class="section-title">Other <span class="section-sub">Guardian / Thargoid / not part of a named family</span></div>
      <div class="material-grid">${otherItems.map(materialCard).join('')}</div>
    </div>` : '';

  document.getElementById('sections').innerHTML = familySections + otherSection;
}

function render() {
  if (!DATA.hasSnapshot) {
    document.getElementById('sections').innerHTML =
      `<div class="empty-note"><div class="empty-note-icon">🧪</div>No materials inventory captured yet -- open your in-game Materials screen (or just play a session; it syncs automatically on login), then run this tool again.</div>`;
    return;
  }
  if (viewMode === 'list') {
    renderList();
  } else {
    renderGrid();
  }
}

function renderSummary() {
  if (!DATA.hasSnapshot) {
    document.getElementById('summaryCards').innerHTML = '';
    return;
  }
  const totalTypes = DATA.raw.length + DATA.manufactured.length + DATA.encoded.length;
  const totalUnits = [...DATA.raw, ...DATA.manufactured, ...DATA.encoded].reduce((s, m) => s + m.count, 0);
  const usedInEngineering = [...DATA.raw, ...DATA.manufactured, ...DATA.encoded].filter(m => m.usage).length;
  const cards = [
    [DATA.raw.length, 'Raw types held'],
    [DATA.manufactured.length, 'Manufactured types held'],
    [DATA.encoded.length, 'Encoded types held'],
    [totalTypes, 'Total distinct materials'],
    [totalUnits.toLocaleString('en-US'), 'Total units held'],
    [usedInEngineering, 'Used in past engineering'],
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(([num, label]) =>
    `<div class="card"><div class="num">${num}</div><div class="label">${escapeHtml(label)}</div></div>`
  ).join('');
  document.getElementById('controlsBar').style.display = '';
}

document.getElementById('filterInput').addEventListener('input', e => { filterText = e.target.value; render(); });
document.getElementById('sortSelect').addEventListener('change', e => { sortKey = e.target.value; render(); });
document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('.view-toggle-btn');
  if (!btn) return;
  viewMode = btn.dataset.mode;
  document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('view-toggle-active', b === btn));
  document.getElementById('filterInput').style.display = viewMode === 'list' ? '' : 'none';
  document.getElementById('sortSelect').style.display = viewMode === 'list' ? '' : 'none';
  render();
});

renderSummary();
render();

// Manual light/dark override -- CSS already auto-follows the OS via
// @media(prefers-color-scheme), but that gives no way to actually compare both from inside the
// page. Stamping data-theme on <html> and pairing it with the :root[data-theme=...] blocks above (each with
// higher specificity than the plain :root a media query targets) lets an explicit choice win
// regardless of OS preference, in either direction. The tiny inline script in <head> applies any
// saved choice before first paint, so there's no flash of the wrong theme on load.
function currentTheme() {
  const forced = document.documentElement.getAttribute('data-theme');
  if (forced === 'light' || forced === 'dark') return forced;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function updateThemeToggleLabel() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  // Icon-only, shows the CURRENTLY ACTIVE theme (sun when light, moon when dark) -- a state
  // indicator you click to flip, same idea as a physical light switch showing its own position.
  const dark = currentTheme() === 'dark';
  btn.textContent = dark ? '🌙' : '☀️';
  btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
// Carries an EXPLICIT theme choice into the other pages' nav links (as a ?theme= query param)
// so it actually persists when clicking around -- these are separate file:// documents, and
// browsers don't reliably share localStorage between distinct local files (some isolate storage
// per exact file path), so localStorage alone silently failed to survive navigation on its own,
// and the theme choice needs to persist across pages. Only rewrites hrefs once a real choice has been
// made (theme is truthy) -- before that, nav links stay plain so OS/media-query preference keeps
// being picked up fresh on every page, same as before this existed.
function propagateThemeToNavLinks(theme) {
  document.querySelectorAll('.page-nav-link[href]').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.setAttribute('href', theme ? base + '?theme=' + theme : base);
  });
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('standalone_theme', theme); } catch (e) { /* storage unavailable */ }
  updateThemeToggleLabel();
  propagateThemeToNavLinks(theme);
}
const themeToggleBtn = document.getElementById('themeToggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
}
updateThemeToggleLabel();
propagateThemeToNavLinks(document.documentElement.getAttribute('data-theme'));
</script>
</body>
</html>
