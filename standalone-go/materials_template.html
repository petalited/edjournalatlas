<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>edjournalatlas -- materials inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: light dark;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --transition: 160ms ease;
  --bg: #f9f9f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --muted-faint: #898781;
  --border: #e1e0d9; --border-strong: #c3c2b7; --accent: #2a78d6; --accent-weak: #e6f0fc;
  --good: #0ca30c; --warning: #fab219;
  --notable-bg: #efe6fb; --notable-text: #6b3fb0;
  --shadow: 0 1px 3px rgba(11,11,11,0.08), 0 1px 2px rgba(11,11,11,0.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --muted-faint: #898781;
    --border: #2c2c2a; --border-strong: #383835; --accent: #3987e5; --accent-weak: #182338;
    --good: #0ca30c; --warning: #fab219;
    --notable-bg: #2c2140; --notable-text: #caa9f7;
    --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); padding: var(--space-5); font-variant-numeric: tabular-nums; }
.page-nav { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.page-nav-link { font-size: 0.85rem; color: var(--muted); text-decoration: none; padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-pill); border: 1px solid var(--border); transition: border-color var(--transition), color var(--transition); }
.page-nav-link:hover { color: var(--accent); border-color: var(--accent); }
.page-nav-link.page-nav-active { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); font-weight: 600; }
h1 { font-size: 1.4rem; margin: 0 0 2px; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 var(--space-4); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3);
  margin-bottom: var(--space-4); max-width: 900px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); box-shadow: var(--shadow); }
.card .num { font-size: 1.3rem; font-weight: 600; }
.card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.controls { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-5);
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); box-shadow: var(--shadow); }
input[type=text], select { background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-size: 0.9rem;
  transition: border-color var(--transition); }
#filterInput { width: 260px; }
.section-block { margin-bottom: var(--space-6); }
.section-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; display: flex; align-items: baseline; gap: var(--space-2); }
.section-sub { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.material-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
.material-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3); box-shadow: var(--shadow); }
.material-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
.material-name { font-weight: 600; font-size: 0.92rem; }
.material-grade { flex: 0 0 auto; font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: var(--radius-pill);
  color: var(--muted); background: var(--bg); border: 1px solid var(--border-strong); }
.material-grade-4, .material-grade-5 { color: var(--notable-text); background: var(--notable-bg); border-color: transparent; }
.material-count { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
.material-usage { margin-top: var(--space-2); font-size: 0.75rem; color: var(--notable-text);
  background: var(--notable-bg); border-radius: var(--radius-sm); padding: 3px var(--space-2); display: inline-block; }
.material-usage-detail { margin-top: 4px; font-size: 0.72rem; color: var(--muted); }
.empty-note { color: var(--muted); padding: var(--space-6) var(--space-4); text-align: center; }
.empty-note-icon { font-size: 1.6rem; margin-bottom: var(--space-2); opacity: 0.7; }
.view-toggle { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 3px; }
.view-toggle-btn { font: inherit; font-size: 0.82rem; color: var(--muted); background: transparent; border: none;
  padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer; transition: background var(--transition), color var(--transition); }
.view-toggle-btn:hover { color: var(--text); }
.view-toggle-active, .view-toggle-active:hover { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: var(--shadow); }
.grid-families { display: flex; flex-direction: column; gap: var(--space-3); }
.grid-family { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3); box-shadow: var(--shadow); }
.grid-family-name { font-weight: 600; font-size: 0.85rem; margin-bottom: var(--space-2); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.03em; }
.grid-family-cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--space-2); }
.grid-cell { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2); }
.grid-cell-held { background: var(--accent-weak); border-color: var(--accent); }
.grid-cell-empty { opacity: 0.5; }
.grid-cell-grade { font-size: 0.65rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
.grid-cell-name { font-size: 0.82rem; font-weight: 600; margin-top: 1px; }
.grid-cell-count { font-size: 0.95rem; font-weight: 700; margin-top: 2px; }
.grid-cell-usage { font-size: 0.68rem; color: var(--notable-text); margin-top: 3px; }
a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm);
}
</style>
</head>
<body>

<nav class="page-nav">
  <a class="page-nav-link" href="standalone_viewer.html">🗺️ Systems</a>
  <a class="page-nav-link" href="standalone_events.html">🔍 Journal search</a>
  <a class="page-nav-link" href="standalone_summary.html">📊 Recap</a>
  <a class="page-nav-link page-nav-active" href="standalone_materials.html">🧪 Materials</a>
</nav>

<h1>standalone -- materials inventory</h1>
<p class="subtitle" id="subtitle"></p>

<div class="cards" id="summaryCards"></div>

<div class="controls" id="controlsBar" style="display:none">
  <div class="view-toggle" id="viewToggle">
    <button type="button" class="view-toggle-btn view-toggle-active" data-mode="grid">🗂️ Grid (in-game families)</button>
    <button type="button" class="view-toggle-btn" data-mode="list">📋 List (sortable)</button>
  </div>
  <input type="text" id="filterInput" placeholder="Search materials..." style="display:none">
  <select id="sortSelect" style="display:none">
    <option value="count">Sort by amount held</option>
    <option value="name">Sort alphabetically</option>
    <option value="grade">Sort by grade (highest first)</option>
  </select>
</div>

<div id="sections"></div>

<script id="materials-data" type="application/json">__DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('materials-data').textContent);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('subtitle').textContent = DATA.hasSnapshot
  ? `Generated ${DATA.generatedAt} -- inventory as of ${DATA.snapshotAt.replace('T', ' ').replace('Z', '')} UTC, the last time the game reported your full materials to the journal (this happens automatically each time you log in -- log in again in-game, then re-run this tool, to refresh).`
  : `Generated ${DATA.generatedAt}.`;

let filterText = '';
let sortKey = 'count';
let viewMode = 'grid';

const CATEGORIES = [
  { key: 'raw', title: 'Raw', sub: 'Elements mined/scooped from planetary surfaces and asteroids' },
  { key: 'manufactured', title: 'Manufactured', sub: 'Salvaged components and commodities' },
  { key: 'encoded', title: 'Encoded', sub: 'Data recovered from scans and signal sources' },
];

function filteredSorted(list) {
  const needle = filterText.trim().toLowerCase();
  let out = needle ? list.filter(m => m.name.toLowerCase().includes(needle)) : list.slice();
  if (sortKey === 'name') {
    out.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortKey === 'grade') {
    out.sort((a, b) => (b.grade || 0) - (a.grade || 0) || b.count - a.count);
  } else {
    out.sort((a, b) => b.count - a.count);
  }
  return out;
}

function usageBadge(m) {
  if (!m.usage) return '';
  const bpEntries = Object.entries(m.usage.blueprints).sort((a, b) => b[1] - a[1]);
  const bpList = bpEntries.map(([bp, n]) => `${escapeHtml(bp)}${n > 1 ? ` (${n}x)` : ''}`).join(', ');
  return `<div class="material-usage" title="Total consumed across your real engineering history">🔧 used ${m.usage.totalUsed.toLocaleString('en-US')}x in engineering</div>
    <div class="material-usage-detail">${bpList}</div>`;
}

function gradeBadge(m) {
  if (!m.grade) return '';
  return `<span class="material-grade material-grade-${m.grade}" title="Grade ${m.grade} material">G${m.grade}</span>`;
}

function materialCard(m) {
  return `<div class="material-card">
    <div class="material-card-head">
      <div class="material-name">${escapeHtml(m.name)}</div>
      ${gradeBadge(m)}
    </div>
    <div class="material-count">${m.count.toLocaleString('en-US')}</div>
    ${usageBadge(m)}
  </div>`;
}

function renderList() {
  const sections = CATEGORIES.map(cat => {
    const list = filteredSorted(DATA[cat.key]);
    const totalTypes = DATA[cat.key].length;
    const totalUnits = DATA[cat.key].reduce((s, m) => s + m.count, 0);
    if (!list.length) {
      return `<div class="section-block">
        <div class="section-title">${cat.title} <span class="section-sub">${cat.sub}</span></div>
        <div class="empty-note">No ${cat.title.toLowerCase()} materials match your search.</div>
      </div>`;
    }
    return `<div class="section-block">
      <div class="section-title">${cat.title}
        <span class="section-sub">${cat.sub} -- ${totalTypes} type${totalTypes === 1 ? '' : 's'}, ${totalUnits.toLocaleString('en-US')} units held</span>
      </div>
      <div class="material-grid">${list.map(materialCard).join('')}</div>
    </div>`;
  }).join('');

  document.getElementById('sections').innerHTML = sections;
}

function gridCell(cell) {
  const usage = cell.usage
    ? `<div class="grid-cell-usage" title="Total consumed across your real engineering history">🔧 ${cell.usage.totalUsed.toLocaleString('en-US')}x</div>`
    : '';
  return `<div class="grid-cell ${cell.held ? 'grid-cell-held' : 'grid-cell-empty'}">
    <div class="grid-cell-grade">Grade ${cell.grade}</div>
    <div class="grid-cell-name">${escapeHtml(cell.name)}</div>
    <div class="grid-cell-count">${cell.held ? cell.count.toLocaleString('en-US') : '—'}</div>
    ${usage}
  </div>`;
}

function gridFamilyRow(fam) {
  return `<div class="grid-family">
    <div class="grid-family-name">${escapeHtml(fam.name)}</div>
    <div class="grid-family-cells">${fam.cells.map(gridCell).join('')}</div>
  </div>`;
}

// The grid groups materials into the same named families (Capacitors, Encoded Firmware,
// "Category 1"-"Category 7" for Raw, ...) the game itself uses for Material Trader trade lines
// and the community reference data this project's grades come from -- one column per grade,
// filled in with what you actually hold, empty where you don't, so it shows the real shape of
// each family rather than just a flat pile of whatever's currently in the inventory.
function renderGrid() {
  const familySections = CATEGORIES.map(cat => {
    const families = DATA.grid[cat.key] || [];
    if (!families.length) return '';
    const held = families.reduce((s, f) => s + f.cells.filter(c => c.held).length, 0);
    const total = families.reduce((s, f) => s + f.cells.length, 0);
    return `<div class="section-block">
      <div class="section-title">${cat.title}
        <span class="section-sub">${cat.sub} -- ${held} of ${total} grades held</span>
      </div>
      <div class="grid-families">${families.map(gridFamilyRow).join('')}</div>
    </div>`;
  }).join('');

  // Guardian/Thargoid/Unknown-* materials don't belong to a named family -- shown separately
  // rather than silently dropped from the grid view.
  const otherItems = CATEGORIES.flatMap(cat => DATA[cat.key].filter(m => !m.family));
  const otherSection = otherItems.length ? `<div class="section-block">
      <div class="section-title">Other <span class="section-sub">Guardian / Thargoid / not part of a named family</span></div>
      <div class="material-grid">${otherItems.map(materialCard).join('')}</div>
    </div>` : '';

  document.getElementById('sections').innerHTML = familySections + otherSection;
}

function render() {
  if (!DATA.hasSnapshot) {
    document.getElementById('sections').innerHTML =
      `<div class="empty-note"><div class="empty-note-icon">🧪</div>No materials inventory captured yet -- open your in-game Materials screen (or just play a session; it syncs automatically on login), then run this tool again.</div>`;
    return;
  }
  if (viewMode === 'list') {
    renderList();
  } else {
    renderGrid();
  }
}

function renderSummary() {
  if (!DATA.hasSnapshot) {
    document.getElementById('summaryCards').innerHTML = '';
    return;
  }
  const totalTypes = DATA.raw.length + DATA.manufactured.length + DATA.encoded.length;
  const totalUnits = [...DATA.raw, ...DATA.manufactured, ...DATA.encoded].reduce((s, m) => s + m.count, 0);
  const usedInEngineering = [...DATA.raw, ...DATA.manufactured, ...DATA.encoded].filter(m => m.usage).length;
  const cards = [
    [DATA.raw.length, 'Raw types held'],
    [DATA.manufactured.length, 'Manufactured types held'],
    [DATA.encoded.length, 'Encoded types held'],
    [totalTypes, 'Total distinct materials'],
    [totalUnits.toLocaleString('en-US'), 'Total units held'],
    [usedInEngineering, 'Used in past engineering'],
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(([num, label]) =>
    `<div class="card"><div class="num">${num}</div><div class="label">${escapeHtml(label)}</div></div>`
  ).join('');
  document.getElementById('controlsBar').style.display = '';
}

document.getElementById('filterInput').addEventListener('input', e => { filterText = e.target.value; render(); });
document.getElementById('sortSelect').addEventListener('change', e => { sortKey = e.target.value; render(); });
document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('.view-toggle-btn');
  if (!btn) return;
  viewMode = btn.dataset.mode;
  document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('view-toggle-active', b === btn));
  document.getElementById('filterInput').style.display = viewMode === 'list' ? '' : 'none';
  document.getElementById('sortSelect').style.display = viewMode === 'list' ? '' : 'none';
  render();
});

renderSummary();
render();
</script>
</body>
</html>
