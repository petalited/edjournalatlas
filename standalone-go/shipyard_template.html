<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=(q==='light'||q==='dark')?q:localStorage.getItem('standalone_theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);if(q)localStorage.setItem('standalone_theme',t);}}catch(e){}})();</script>
<title>standalone -- shipyard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: light dark;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --transition: 160ms ease;
  --bg: #f9f9f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --muted-faint: #898781;
  --border: #e1e0d9; --border-strong: #c3c2b7; --accent: #2a78d6; --accent-weak: #e6f0fc;
  --good: #0ca30c; --good-bg: #e5f7e5; --warning: #b5710a; --warning-bg: #fdf1de;
  --bonus-bg: #fdf1d3; --bonus-text: #7a5a00;
  --notable-bg: #efe6fb; --notable-text: #6b3fb0;
  --bad-bg: #fbe2df; --bad-text: #c22f2f;
  --shadow: 0 1px 2px rgba(20,18,12,0.06), 0 6px 16px -8px rgba(20,18,12,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0d12; --panel: #15181d; --text: #f2f3f5; --muted: #b7bcc4; --muted-faint: #7c828b;
    --border: #262a31; --border-strong: #343a43; --accent: #3987e5; --accent-weak: #17233a;
    --good: #3ecf3e; --good-bg: #12291a; --warning: #e0a53c; --warning-bg: #2e2312;
    --bonus-bg: #3d3110; --bonus-text: #f0c766;
    --notable-bg: #2c2140; --notable-text: #caa9f7;
    --bad-bg: #3a1f1f; --bad-text: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 8px 20px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.045);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 999px;
  --transition: 160ms ease;
  --bg: #f9f9f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --muted-faint: #898781;
  --border: #e1e0d9; --border-strong: #c3c2b7; --accent: #2a78d6; --accent-weak: #e6f0fc;
  --good: #0ca30c; --good-bg: #e5f7e5; --warning: #b5710a; --warning-bg: #fdf1de;
  --bonus-bg: #fdf1d3; --bonus-text: #7a5a00;
  --notable-bg: #efe6fb; --notable-text: #6b3fb0;
  --bad-bg: #fbe2df; --bad-text: #c22f2f;
  --shadow: 0 1px 2px rgba(20,18,12,0.06), 0 6px 16px -8px rgba(20,18,12,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d12; --panel: #15181d; --text: #f2f3f5; --muted: #b7bcc4; --muted-faint: #7c828b;
  --border: #262a31; --border-strong: #343a43; --accent: #3987e5; --accent-weak: #17233a;
  --good: #3ecf3e; --good-bg: #12291a; --warning: #e0a53c; --warning-bg: #2e2312;
  --bonus-bg: #3d3110; --bonus-text: #f0c766;
  --notable-bg: #2c2140; --notable-text: #caa9f7;
  --bad-bg: #3a1f1f; --bad-text: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 8px 20px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.045);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); padding: var(--space-5); font-variant-numeric: tabular-nums; }
.page-nav { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.page-nav-link { font-size: 0.85rem; color: var(--muted); text-decoration: none; padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-pill); border: 1px solid var(--border); transition: border-color var(--transition), color var(--transition); }
.page-nav-link:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.page-nav-link.page-nav-active { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); font-weight: 600;
  box-shadow: 0 2px 10px -4px color-mix(in srgb, var(--accent) 50%, transparent); }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 var(--space-5); max-width: 900px; }
.empty-note { color: var(--muted); padding: var(--space-6) var(--space-4); text-align: center;
  border: 1px dashed var(--border); border-radius: var(--radius-md); }
.empty-note-icon { font-size: 1.9rem; margin-bottom: var(--space-2); opacity: 0.75; }
/* A 16:9 grid layout, only viable because the module list stopped living inline in the card
   (moved to hover-preview/click-modal, previous round): a card's visible content height no longer
   varies with how many modules a ship has, so every card can share the same 16:9 box without
   wildly differing amounts of leftover/cramped space. */
.fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--space-4); }
.ship-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: var(--space-4); position: relative;
  aspect-ratio: 16 / 9; }
.ship-card.ship-active { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
/* A faint monospace ASCII-art watermark stretched to fill the ENTIRE card (not just a small
   corner), sitting behind
   the card's real content (z-index 0 vs. .ship-card-fg's 1). .ship-ascii-wrap clips to the card's
   rounded corners and is the stretch target; the inner <pre> is scaled to it via a per-card
   `transform: scale(x,y)` computed in JS (fitShipAscii) since its natural rendered size varies
   with each art string's own width/height -- unequal x/y scale is expected and is exactly the
   "lightly distorted" look asked for, a natural side effect of stretching monospace text to fill
   an arbitrary box rather than a deliberate additional effect on top. Tinted off var(--muted-faint)
   rather than a literal hardcoded light grey so it still reads as a subtle blend-in in dark theme
   too, not a stark light-grey block on a dark background. Text-only, zero image assets, so it stays
   as lightweight as the rest of this page. Populated from SHIP_ASCII below, keyed by the exact real
   ship type display name -- unknown types just render no art rather than guessing at a shape that
   might not match the real hull.
   Real bug, fixed: `.ship-card` itself used to carry `overflow: hidden` (to keep this wrap's
   square corners from peeking past the card's own rounded ones) -- but that also clipped anything
   ELSE absolutely positioned inside the card that needed to escape its bounds, including the
   module hover preview opening upward past the top edge ("the top of the window... is kinda cut
   off once it goes over the top of the ships box"). Fixed by giving the clipping job to this wrap
   alone (`border-radius: inherit` + its own `overflow: hidden`, so it still clips to the same
   rounded shape) and removing `overflow: hidden` from `.ship-card` entirely -- now nothing inside
   the card is forced to stay within its box unless it specifically needs to. */
.ship-ascii-wrap { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; z-index: 0; pointer-events: none; }
.ship-ascii { margin: 0; transform-origin: top left;
  font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9px; line-height: 1.05;
  color: var(--muted-faint); opacity: 0.22; white-space: pre; user-select: none; }
.ship-card-fg { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.ship-info-row { display: flex; flex-wrap: wrap; gap: 4px var(--space-3); font-size: 0.78rem; color: var(--muted); margin-bottom: var(--space-2); }
.ship-info-row strong { color: var(--text); font-weight: 600; }
.ship-card-spacer { flex: 1; }
.ship-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-1); }
.ship-head-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.ship-title { font-size: 1.05rem; font-weight: 700; }
.ship-tag { font-size: 0.78rem; color: var(--muted); font-weight: 400; margin-left: 6px; }
.ship-active-badge { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--accent); background: var(--accent-weak); border-radius: var(--radius-pill); padding: 2px 8px; white-space: nowrap; }
.engineer-ship-btn { font-size: 0.72rem; padding: 3px 10px; border-radius: var(--radius-pill); cursor: pointer;
  background: var(--panel); color: var(--text); border: 1px solid var(--border-strong); white-space: nowrap;
  transition: border-color var(--transition), color var(--transition); }
.engineer-ship-btn:hover { border-color: var(--accent); color: var(--accent); }
.ship-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: var(--space-3); }
.ship-value { font-weight: 700; }
.completion-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.completion-bar { flex: 1; height: 8px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.completion-bar-fill { height: 100%; background: var(--accent); border-radius: var(--radius-pill); transition: width var(--transition); }
.completion-label { font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
/* Replaced an earlier <details>/<summary> expand-button version, which made the page look
   cluttered, with hover-to-preview/click-to-open instead: a plain text hint (no button chrome)
   that reveals a small hover preview (CSS shows/hides it, no JS needed for that part), while an
   actual click opens the full list in a modal (#shipModulesModalOverlay).
   Real bug, fixed: this hint sits at the BOTTOM of each 16:9 card (pushed there by
   .ship-card-spacer), so the preview's default "open downward" position could land partly or
   fully below the viewport, especially for cards in a lower grid row. Default direction flipped
   to open upward (toward the card's own body, which is already on-screen) as the common case,
   with positionModuleHoverPreview (JS, on hover) flipping back to downward -- and clamping
   horizontally -- only when there's genuinely more room that way, so it can never land off-screen
   regardless of where the card sits in the grid.
   Second real bug, fixed: the label and the preview had a 4px margin gap between them -- moving
   the mouse from the label toward the preview crossed a strip of page that belongs to neither
   box, ending the CSS :hover match (and the preview's own `:hover` self-keep-open rule can't save
   it if it already went display:none before the cursor arrives), so the preview could vanish
   before the cursor ever reached it. Margin dropped to 0 in both CSS and JS so the two boxes
   touch directly -- the cursor is always over one or the other, no gap left to cross. */
.module-hint { position: relative; margin-top: var(--space-2); font-size: 0.8rem; color: var(--muted); }
.module-hint-label { cursor: pointer; }
.module-hint-label:hover { color: var(--accent); }
.module-hover-preview { display: none; position: absolute; left: 0; bottom: 100%; margin: 0; z-index: 15;
  width: 300px; max-width: 80vw; max-height: 320px; overflow-y: auto; text-align: left;
  background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  box-shadow: var(--shadow); padding: var(--space-2); }
.module-hint-label:hover + .module-hover-preview, .module-hover-preview:hover { display: block; }
.module-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
.module-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  padding: 6px var(--space-2); border-radius: var(--radius-sm); font-size: 0.82rem; }
.module-row-engineered { background: var(--accent-weak); }
.module-name { font-weight: 600; }
.module-off { opacity: 0.5; text-decoration: line-through; }
.module-detail { font-size: 0.72rem; color: var(--muted); }
.module-grade-badge { font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: var(--radius-pill);
  color: var(--accent); background: var(--panel); border: 1px solid var(--accent); white-space: nowrap; }
.module-grade-badge.module-grade-max { color: var(--good); border-color: var(--good); background: var(--good-bg); }
.no-modules-note { font-size: 0.82rem; color: var(--muted); font-style: italic; }
.snapshot-note { font-size: 0.76rem; color: var(--muted-faint); margin-top: var(--space-3); }

/* "⚙️ Engineer" modal -- lets you push a fitted module's engineering into the engineering
   planner's basket in one click, rather than needing to switch pages and re-enter it by hand.
   Same modal-overlay visual language as the trade calculator on the materials/engineering pages,
   kept as its own independent class names since this is a separate self-contained embedded file. */
.engineer-modal-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.55); display: flex;
  align-items: center; justify-content: center; z-index: 100; padding: var(--space-4); }
.engineer-modal-overlay[hidden] { display: none; }
.engineer-modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); max-width: 1100px; width: 100%; max-height: 85vh; overflow-y: auto;
  padding: var(--space-5); }
.engineer-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.engineer-modal-title { font-size: 1.1rem; font-weight: 700; }
.engineer-modal-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; max-width: 560px; }
.engineer-modal-close { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); line-height: 1; padding: 4px; }
.engineer-modal-close:hover { color: var(--text); }
.engineer-modal-body { display: flex; flex-direction: column; gap: var(--space-2); }
.engineer-module-row { border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); }
.engineer-module-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
.engineer-module-name { font-weight: 600; font-size: 0.9rem; }
.engineer-module-state { font-size: 0.76rem; color: var(--muted); }
.engineer-module-controls { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.engineer-module-controls select { background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-size: 0.85rem; font: inherit;
  transition: border-color var(--transition); }
.engineer-module-controls select:hover { border-color: var(--border-strong); }
.engineer-name-select { min-width: 180px; flex: 1; }
.engineer-grade-select { min-width: 90px; }
.engineer-effect-select { min-width: 160px; }
.engineer-add-btn { font-size: 0.82rem; padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); cursor: pointer;
  background: var(--accent); color: #fff; border: 1px solid var(--accent); white-space: nowrap;
  transition: background var(--transition); }
.engineer-add-btn:hover { background: color-mix(in srgb, var(--accent) 85%, black); }
.engineer-add-btn.engineer-add-added { background: var(--good); border-color: var(--good); }
.goal-clear-btn { font-size: 0.78rem; padding: var(--space-2) 10px; border-radius: var(--radius-sm); cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--border-strong); white-space: nowrap;
  transition: border-color var(--transition), color var(--transition); }
.goal-clear-btn:hover { border-color: var(--bad-text); color: var(--bad-text); }

/* Export/Import to EDSY/Coriolis. See
   the export/import JS functions below for the real, verified encoding this is built on (raw
   journal Loadout JSON, deflate-compressed, base64 -- the same mechanism both Coriolis's own real
   `shipFromLoadoutJSON` importer and EDSY's own real Journal-import path already accept). */
.engineer-export-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
.export-btn { font-size: 0.8rem; padding: var(--space-2) var(--space-3); border-radius: var(--radius-pill); cursor: pointer;
  background: var(--panel); color: var(--text); border: 1px solid var(--border-strong); white-space: nowrap;
  transition: border-color var(--transition), color var(--transition); }
.export-btn:hover { border-color: var(--accent); color: var(--accent); }
.export-btn.copied { color: #fff; background: var(--accent); border-color: var(--accent); }
.export-btn.copy-failed { color: #fff; background: var(--bad-text); border-color: var(--bad-text); }
.engineer-import-row { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.engineer-import-input { flex: 1; min-width: 220px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-size: 0.85rem; font: inherit; }
.engineer-import-btn { font-size: 0.85rem; padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); cursor: pointer;
  background: var(--accent); color: #fff; border: 1px solid var(--accent); white-space: nowrap; }
.engineer-import-btn:hover { background: color-mix(in srgb, var(--accent) 85%, black); }
.import-result { font-size: 0.8rem; margin-bottom: var(--space-3); padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm); display: none; }
.import-result.import-visible { display: block; }
.import-result.import-ok { background: var(--good-bg); color: var(--good); border: 1px solid var(--good); }
.import-result.import-partial { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
.import-result.import-error { background: var(--bad-bg); color: var(--bad-text); border: 1px solid var(--bad-text); }

/* "Current Ship" / "Goal Ship" comparison -- shows a side-by-side current-vs-goal build so it's
   clear how far along a ship is toward finishing. Real bug, fixed: the first version rendered two
   fully independent stacked lists (map+join per column) -- the goal cell is taller than the current
   cell (badge + 3 selects + buttons vs. 2-3 lines of text), so row N's height differed between
   columns and every row below it drifted out of alignment. Fixed by emitting ONE flat grid whose
   children alternate current-cell, goal-cell per module (title cells first) -- with the default
   grid `align-items: stretch` (no override here), each same-row pair is locked to a shared row
   track sized to the taller of the two, so pairs can never drift apart regardless of content
   height, and the current cell is asked to fill that same height rather than floating short. */
.compare-columns { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--space-4); row-gap: var(--space-2); }
.compare-column-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); margin-bottom: var(--space-1); padding-bottom: var(--space-2); border-bottom: 1px solid var(--border); }
.compare-module-row { border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3); box-sizing: border-box; height: 100%;
  display: flex; flex-direction: column; justify-content: center; }
.engineer-module-row.compare-goal-cell { box-sizing: border-box; height: 100%; }
.compare-module-name { font-weight: 600; font-size: 0.85rem; }
.compare-module-state { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
.compare-module-detail { font-size: 0.72rem; color: var(--muted-faint); margin-top: 2px; }
.goal-badge { font-size: 0.76rem; font-weight: 600; color: var(--accent); background: var(--accent-weak);
  border-radius: var(--radius-sm); padding: 3px var(--space-2); margin-bottom: var(--space-2); display: inline-block; }
.goal-badge.goal-badge-unset { color: var(--muted); background: var(--bg); font-weight: 400; font-style: italic; }

/* Self-contained "Materials Needed" panel, so a materials shortfall is visible without needing to
   flip to the engineering planner page. Reuses the exact same modal-overlay visual language as the
   Engineer modal above (same class names -- this IS a second modal on the same page, not a
   separate visual system, so sharing them is intentional here, unlike the deliberately
   independent naming this page uses versus OTHER pages' own trade-calculator modal). */
.materials-needed-btn { position: fixed; top: var(--space-4); right: 66px; z-index: 20;
  font-size: 0.82rem; padding: var(--space-2) var(--space-4); border-radius: var(--radius-pill); cursor: pointer;
  background: var(--panel); color: var(--text); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  transition: border-color var(--transition), color var(--transition); }
.materials-needed-btn:hover { border-color: var(--accent); color: var(--accent); }
.materials-needed-btn:disabled { opacity: 0.55; cursor: default; }
.plan-list { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
.plan-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); }
.plan-row-name { font-weight: 600; font-size: 0.88rem; }
.plan-row-detail { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
.plan-remove-btn { font-size: 0.76rem; padding: 3px 10px; border-radius: var(--radius-pill); cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--border-strong); white-space: nowrap;
  transition: border-color var(--transition), color var(--transition); }
.plan-remove-btn:hover { border-color: var(--bad-text); color: var(--bad-text); }
.materials-section-title { font-size: 0.95rem; font-weight: 700; margin: 0 0 var(--space-3); padding-top: var(--space-3);
  border-top: 1px solid var(--border); display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.materials-section-sub { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
.need-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-3); }
.need-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3); box-shadow: var(--shadow); }
.need-card.need-short { border-color: var(--warning); background: var(--warning-bg); box-shadow: var(--shadow), inset 3px 0 0 var(--warning); }
