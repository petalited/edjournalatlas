<script id="shipyard-data" type="application/json">__DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('shipyard-data').textContent);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatCredits(n) {
  if (n == null) return '';
  return n.toLocaleString('en-US') + ' cr';
}

// Trade calculator -- ported verbatim (same classes/JS logic) from engineering_template.html so
// this page's Materials Needed panel feature-matches the engineering planner's own: click a
// "short by X" material-needed card to see what you could give up from what you already hold to
// cover it, plus the nearest known trader of the right type. Ratio math and family/type rules are
// the real Material Trader mechanic -- see docs/MaterialTraderMechanics.md for full derivation.
function tradeQuantities(giveGrade, giveFamily, getGrade, getFamily) {
  let give = 1, get = 1;
  if (getGrade > giveGrade) give = Math.pow(6, getGrade - giveGrade);
  else if (getGrade < giveGrade) get = Math.pow(3, giveGrade - getGrade);
  if (giveFamily !== getFamily) give *= 6;
  return { give, get };
}
const tradeCatalogByKey = {};
((DATA.trading && DATA.trading.materialCatalog) || []).forEach(m => { tradeCatalogByKey[m.key] = m; });
function heldCountFor(key) { return (DATA.heldMaterials && DATA.heldMaterials[key]) || 0; }
function traderTypeLabel(t) {
  return t === 'raw' ? 'Raw' : t === 'manufactured' ? 'Manufactured' : t === 'encoded' ? 'Encoded' : t;
}
function tradersForType(type) {
  return ((DATA.trading && DATA.trading.traders) || []).filter(t => t.type === type);
}
function formatDistance(t) {
  return t.distanceLy == null ? '' : ` -- ${t.distanceLy.toLocaleString('en-US', { maximumFractionDigits: 1 })} ly`;
}
function familyGroupsForType(type) {
  const order = [];
  const byName = {};
  ((DATA.trading && DATA.trading.materialCatalog) || []).forEach(m => {
    if (m.type !== type) return;
    if (!byName[m.family]) { byName[m.family] = []; order.push(m.family); }
    byName[m.family].push(m);
  });
  order.forEach(fam => byName[fam].sort((a, b) => a.grade - b.grade));
  return order.map(fam => ({ name: fam, materials: byName[fam] }));
}
function classifyTradeCell(held, maxObtainable, ratioCostPerUnit, neededElsewhere) {
  if (held <= 0 || maxObtainable <= 0) return 'empty';
  if (neededElsewhere > 0) return 'red';
  if (ratioCostPerUnit <= 1 || maxObtainable >= 10) return 'blue';
  return 'yellow';
}
function tradeGridCell(m, target, neededElsewhereMap) {
  if (m.key === target.key) {
    return `<div class="trade-grid-cell trade-grid-cell-target">
      <div class="grid-cell-grade">Grade ${m.grade}</div>
      <div class="grid-cell-name">${escapeHtml(m.name)}</div>
      <div class="trade-grid-cell-label">Target</div>
    </div>`;
  }
  const held = heldCountFor(m.key);
  const { give, get } = tradeQuantities(m.grade, m.family, target.grade, target.family);
  const maxObtainable = held >= give ? Math.floor(held / give) * get : 0;
  const neededElsewhere = (neededElsewhereMap && neededElsewhereMap[m.key] && neededElsewhereMap[m.key].count) || 0;
  const cls = classifyTradeCell(held, maxObtainable, give / get, neededElsewhere);
  const title = cls === 'red'
    ? `Needed elsewhere in your plan (need ${neededElsewhere.toLocaleString('en-US')}, hold ${held.toLocaleString('en-US')}) -- trading this away could leave you short there.`
    : cls === 'empty'
    ? (held > 0
        ? `You hold ${held.toLocaleString('en-US')} ${m.name}, but a trade needs ${give.toLocaleString('en-US')} -- not enough for even one.`
        : `You don't currently hold any ${m.name}.`)
    : `Give ${give.toLocaleString('en-US')} ${m.name} to get ${get.toLocaleString('en-US')} ${target.name} -- up to ${maxObtainable.toLocaleString('en-US')} total from what you hold.`;
  return `<div class="trade-grid-cell trade-grid-cell-${cls}" title="${escapeHtml(title)}">
    <div class="grid-cell-grade">Grade ${m.grade}</div>
    <div class="grid-cell-name">${escapeHtml(m.name)}</div>
    <div class="grid-cell-count">${held ? held.toLocaleString('en-US') + ' held' : '—'}</div>
    ${maxObtainable > 0 ? `<div class="trade-grid-cell-ratio">${give.toLocaleString('en-US')} → ${get.toLocaleString('en-US')}</div><div class="trade-grid-cell-max">up to ${maxObtainable.toLocaleString('en-US')} total</div>` : ''}
  </div>`;
}
function tradeGridHtml(target, neededElsewhereMap) {
  const groups = familyGroupsForType(target.type);
  return `<div class="grid-families">${groups.map(g => `<div class="grid-family">
    <div class="grid-family-name">${escapeHtml(g.name)}</div>
    <div class="grid-family-cells">${g.materials.map(m => tradeGridCell(m, target, neededElsewhereMap)).join('')}</div>
  </div>`).join('')}</div>`;
}
function tradersSectionHtml(target) {
  const traders = tradersForType(target.type);
  return traders.length
    ? traders.map(t => `<div class="trader-row">
        <div>
          <div class="trade-candidate-name">${escapeHtml(t.station)}</div>
          <div class="trade-candidate-detail">${escapeHtml(t.system)}${formatDistance(t)} · last traded ${escapeHtml((t.lastUsedAt || '').slice(0, 10))}</div>
        </div>
        <button type="button" class="copy-btn-small trader-copy-btn" data-system="${escapeHtml(t.system)}">Copy system</button>
      </div>`).join('')
    : `<p class="empty-note">No known ${traderTypeLabel(target.type).toLowerCase()} material trader in your journal history yet -- visit one and complete any trade there to have it remembered here.</p>`;
}
function tradeModalHtml(target, neededElsewhereMap) {
  return `
    <button type="button" class="trade-show-traders-btn" id="tradeShowTradersBtn">📍 Show nearby ${traderTypeLabel(target.type)} traders</button>
    <div id="tradeTradersSection" hidden>
      <div class="trade-section-title">Nearest known ${traderTypeLabel(target.type)} trader${DATA.trading && DATA.trading.currentSystem ? ` (from ${escapeHtml(DATA.trading.currentSystem)})` : ''}</div>
      ${tradersSectionHtml(target)}
    </div>
    <div class="trade-legend">
      <span class="trade-legend-item"><span class="trade-legend-swatch trade-legend-swatch-blue"></span>Efficient or plentiful</span>
      <span class="trade-legend-item"><span class="trade-legend-swatch trade-legend-swatch-yellow"></span>Costly but possible</span>
      <span class="trade-legend-item"><span class="trade-legend-swatch trade-legend-swatch-red"></span>Needed elsewhere in your plan</span>
    </div>
    ${tradeGridHtml(target, neededElsewhereMap)}
  `;
}
let currentTradeTarget = null;
function openTradeModal(targetKey, neededQty) {
  const target = tradeCatalogByKey[targetKey];
  if (!target) return;
  currentTradeTarget = target;
  document.getElementById('tradeModalTitle').textContent = `🔄 Trade for ${target.name}`;
  document.getElementById('tradeModalSub').textContent = neededQty != null
    ? `Grade ${target.grade} · ${target.family} · you're short ${neededQty.toLocaleString('en-US')}`
    : `Grade ${target.grade} · ${target.family}`;
  document.getElementById('tradeModalBody').innerHTML = tradeModalHtml(target, computeNeededMap());
  document.getElementById('tradeModalOverlay').hidden = false;
}
function closeTradeModal() {
  document.getElementById('tradeModalOverlay').hidden = true;
}
document.getElementById('tradeModalClose').addEventListener('click', closeTradeModal);
document.getElementById('tradeModalOverlay').addEventListener('click', e => {
  if (e.target.id === 'tradeModalOverlay') closeTradeModal();
});
document.getElementById('tradeModalBody').addEventListener('click', e => {
  const showBtn = e.target.closest('#tradeShowTradersBtn');
  if (showBtn) {
    const section = document.getElementById('tradeTradersSection');
    section.hidden = !section.hidden;
    const label = currentTradeTarget ? traderTypeLabel(currentTradeTarget.type) : '';
    showBtn.textContent = section.hidden ? `📍 Show nearby ${label} traders` : `📍 Hide nearby traders`;
    return;
  }
  const btn = e.target.closest('.trader-copy-btn');
  if (!btn) return;
  copyToClipboard(btn.dataset.system).then(ok => {
    const original = btn.textContent;
    btn.textContent = ok ? '✓ Copied' : '✗ Failed';
    btn.classList.add(ok ? 'copied' : 'copy-failed');
    setTimeout(() => { btn.textContent = original; btn.classList.remove(ok ? 'copied' : 'copy-failed'); }, ok ? 1200 : 2500);
  });
});
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* best effort */ }
  document.body.removeChild(ta);
  return ok;
}

// Manual light/dark override -- see the other five pages for the same pattern/comment.
function currentTheme() {
  const forced = document.documentElement.getAttribute('data-theme');
  if (forced === 'light' || forced === 'dark') return forced;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function updateThemeToggleLabel() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  const dark = currentTheme() === 'dark';
  btn.textContent = dark ? '🌙' : '☀️';
  btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
function propagateThemeToNavLinks(theme) {
  document.querySelectorAll('.page-nav-link[href]').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.setAttribute('href', theme ? base + '?theme=' + theme : base);
  });
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('standalone_theme', theme); } catch (e) { /* storage unavailable */ }
  updateThemeToggleLabel();
  propagateThemeToNavLinks(theme);
}
const themeToggleBtn = document.getElementById('themeToggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
}
updateThemeToggleLabel();
propagateThemeToNavLinks(document.documentElement.getAttribute('data-theme'));

document.getElementById('subtitle').textContent = DATA.hasFleetData
  ? `Generated ${DATA.generatedAt} -- your active ship is always current; the rest of your fleet reflects your last Shipyard visit${DATA.snapshotAt ? ` (${DATA.snapshotAt.replace('T', ' ').replace('Z', '')} UTC)` : ''}.`
  : `Generated ${DATA.generatedAt}.`;

// Real bug, fixed: an earlier version wrote straight into the SAME basket the engineering planner
// page reads (standalone_engineering_basket), on the assumption a saved localStorage value would
// just be there when you later open that other page -- but separate file:// pages can't reliably
// share localStorage (some browsers isolate storage per exact file path, not per directory), the
// same real constraint this project already ran into building the theme toggle. Fixed by keeping
// the shipyard page's own self-contained plan (own storage key, own materials-needed panel below)
// that never depends on navigating anywhere else.
//
// The Engineer modal shows the current and goal builds side by side per module slot, which needed
// a real reshape from a flat qty-based plan (fine for a cross-fleet
// materials total, but with no sense of "this ship's goal state") to per-SLOT goal overrides --
// one entry per real module slot the commander has actually set a goal for, keyed by the ship's
// real ShipID + that module's real Slot name (NOT array index -- confirmed real risk: ship list
// order isn't stable across tool re-runs, e.g. after selling a ship, so an index-keyed goal could
// silently attach to the wrong ship/module next time the report is regenerated). One real,
// accepted limitation: ShipID itself can be reused after a ship is sold (documented in
// shipyard.go's own header) -- a goal set on a slot could in principle survive to misleadingly
// apply to a *different*, later ship reusing the same ID+slot combo. Rare, and the fix is just
// "clear the stale goal," not worth more complexity to prevent given how narrow the window is.
//
// fromGrade is the real, additional piece the old cross-page basket never had a way to express:
// accounting for partial upgrades. Pushing an ALREADY grade-3 module to grade 5 only actually
// costs grades 4+5 worth of materials (real game mechanic: each roll only
// pays for the grade it's currently completing), not the full 1-through-5 a from-scratch pick
// would need. Every goal override carries its own real fromGrade (0 for a never-engineered
// module, or the module's actual current grade when continuing the SAME blueprint it already
// has -- switching to a genuinely different blueprint name always starts over at 0, since Elite
// Dangerous blueprint progress doesn't carry across different upgrade names on the same module).
const GOALS_STORAGE_KEY = 'standalone_shipyard_goals';
function loadGoals() {
  try {
    const raw = localStorage.getItem(GOALS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
function saveGoals(goals) {
  try { localStorage.setItem(GOALS_STORAGE_KEY, JSON.stringify(goals)); } catch (e) { /* storage unavailable or full */ }
}
let goals = loadGoals(); // key -> { shipLabel, moduleName, type, name, toGrade, fromGrade, effect }
function goalKey(ship, m) { return `${ship.shipId}::${m.slot}`; }
function setGoal(ship, m, moduleIndex, type, name, toGrade, effect, fromGrade) {
  goals[goalKey(ship, m)] = { shipLabel: ship.name || ship.type, moduleName: m.name, type, name, toGrade, fromGrade, effect: effect || null };
  saveGoals(goals);
  updateMaterialsBtn();
}
function clearGoalByKey(key) {
  delete goals[key];
  saveGoals(goals);
  updateMaterialsBtn();
}

// bpIndex/effectIndex: type -> name -> grade -> ingredients, same shape/purpose as the
// engineering planner's own client-side index (engineering_template.html) -- built once here
// from the per-grade blueprint/effect data this page now embeds for exactly this reason.
const bpIndex = {};
(DATA.blueprints || []).forEach(bp => {
  bpIndex[bp.type] = bpIndex[bp.type] || {};
  bpIndex[bp.type][bp.name] = bpIndex[bp.type][bp.name] || {};
  bpIndex[bp.type][bp.name][bp.grade] = bp;
});
const effectIndex = {};
(DATA.effects || []).forEach(ef => {
  effectIndex[ef.type] = effectIndex[ef.type] || {};
  effectIndex[ef.type][ef.name] = ef;
});

// cumulativeIngredients: real Elite Dangerous mechanic (same one this project's engineering
// planner already accounts for, extended here with a real fromGrade lower bound) -- at max
// engineer rank, grade N takes N rolls, and reaching grade N means rolling every lower grade
// first. A module already at grade fromGrade has already paid for grades 1..fromGrade, so only
// fromGrade+1..toGrade still needs
// summing, not the full 1..toGrade a from-scratch pick would need.
function cumulativeIngredients(type, name, fromGrade, toGrade) {
  const byGrade = (bpIndex[type] || {})[name] || {};
  const out = [];
  for (let g = fromGrade + 1; g <= toGrade; g++) {
    const bp = byGrade[g];
    if (!bp) continue;
    bp.ingredients.forEach(ing => out.push({ key: ing.key, name: ing.name, count: ing.count * g }));
  }
  return out;
}

function updateMaterialsBtn() {
  const btn = document.getElementById('materialsNeededBtn');
  if (!btn) return;
  const count = Object.keys(goals).length;
  btn.textContent = `🧰 Materials Needed${count ? ` (${count})` : ''}`;
  btn.disabled = count === 0;
}

function planRow(key, g) {
  const range = g.fromGrade > 0 ? `Grade ${g.fromGrade} → ${g.toGrade}` : `Grade ${g.toGrade}`;
  return `<div class="plan-row">
    <div>
      <span class="plan-row-name">${escapeHtml(g.shipLabel)} -- ${escapeHtml(g.moduleName)}</span>
      <div class="plan-row-detail">${escapeHtml(g.type)} -- ${escapeHtml(g.name)}, ${escapeHtml(range)}${g.effect ? ' · ✨ ' + escapeHtml(g.effect) : ''}</div>
    </div>
    <button type="button" class="plan-remove-btn" data-goal-key="${escapeHtml(key)}">Remove</button>
  </div>`;
}

// Shared by materialsGrid (the visible cards) and the trade grid (which needs to know, for ANY
// material in the same category as whatever's being traded FOR, whether the plan already needs it
// elsewhere too, see tradeGridCell's "red" case) -- same split the engineering planner's own
// computeNeededMap/materialsSummary use, just built from this page's per-slot `goals` instead of a
// flat basket array.
function computeNeededMap() {
  const needed = {}; // key -> {name, count}
  Object.values(goals).forEach(g => {
    cumulativeIngredients(g.type, g.name, g.fromGrade, g.toGrade).forEach(ing => {
      if (!needed[ing.key]) needed[ing.key] = { name: ing.name, count: 0 };
      needed[ing.key].count += ing.count;
    });
    if (g.effect) {
      const ef = (effectIndex[g.type] || {})[g.effect];
      if (ef) {
        ef.ingredients.forEach(ing => {
          if (!needed[ing.key]) needed[ing.key] = { name: ing.name, count: 0 };
          needed[ing.key].count += ing.count;
        });
      }
    }
  });
  return needed;
}

function materialsGrid() {
  const needed = computeNeededMap();
  const rows = Object.entries(needed).map(([key, v]) => ({ key, ...v }));
  if (!rows.length) return `<p class="empty-note">Nothing needs any materials yet -- every queued goal is already fully covered by grades already rolled.</p>`;
  rows.sort((a, b) => {
    const shortA = a.count - (DATA.heldMaterials[a.key] || 0);
    const shortB = b.count - (DATA.heldMaterials[b.key] || 0);
    return shortB - shortA || a.name.localeCompare(b.name);
  });
  // Same trade-trigger pattern as the engineering planner's own materialsSummary: only short
  // cards get it, and only if the material is actually tradeable
  // (belongs to a named family -- Guardian/Thargoid materials aren't tradeable at any Material
  // Trader, see docs/MaterialTraderMechanics.md).
  const cards = rows.map(m => {
    const held = DATA.heldMaterials[m.key] || 0;
    const short = m.count - held;
    const cls = short > 0 ? 'need-short' : 'need-met';
    const status = short > 0 ? `Short by ${short.toLocaleString('en-US')}` : 'You have enough';
    const tradeable = short > 0 && !!tradeCatalogByKey[m.key];
    const tradeAttrs = tradeable ? ` data-material-key="${escapeHtml(m.key)}" data-short="${short}" title="Click to see trade options to cover this shortfall"` : '';
    return `<div class="need-card ${cls}${tradeable ? ' trade-trigger' : ''}"${tradeAttrs}>
      <div class="need-name">${escapeHtml(m.name)}</div>
      <div class="need-amounts">${held.toLocaleString('en-US')} / ${m.count.toLocaleString('en-US')}</div>
      <div class="need-status">${status}</div>
    </div>`;
  }).join('');
  return `<div class="need-grid">${cards}</div>`;
}

function renderMaterialsPanel() {
  const entries = Object.entries(goals);
  const planHtml = entries.length
    ? entries.map(([key, g]) => planRow(key, g)).join('')
    : '<p class="empty-note">Nothing in your plan yet -- use ⚙️ Engineer on a ship to set a goal.</p>';
  document.getElementById('materialsModalBody').innerHTML = `
    <div class="plan-list">${planHtml}</div>
    <div class="materials-section-title">Materials needed <span class="materials-section-sub">held / needed, across every ship's goals</span></div>
    ${materialsGrid()}
  `;
}
function openMaterialsPanel() {
  renderMaterialsPanel();
  document.getElementById('materialsModalOverlay').hidden = false;
}
function closeMaterialsPanel() {
  document.getElementById('materialsModalOverlay').hidden = true;
}
document.getElementById('materialsNeededBtn').addEventListener('click', openMaterialsPanel);
document.getElementById('materialsModalClose').addEventListener('click', closeMaterialsPanel);
document.getElementById('materialsModalOverlay').addEventListener('click', e => {
  if (e.target.id === 'materialsModalOverlay') closeMaterialsPanel();
});
document.getElementById('materialsModalBody').addEventListener('click', e => {
  const trigger = e.target.closest('.trade-trigger');
  if (trigger && trigger.dataset.materialKey) {
    openTradeModal(trigger.dataset.materialKey, trigger.dataset.short ? Number(trigger.dataset.short) : undefined);
    return;
  }
  const btn = e.target.closest('.plan-remove-btn');
  if (!btn) return;
  clearGoalByKey(btn.dataset.goalKey);
  renderMaterialsPanel();
  // If the Engineer modal is open on the ship this goal belonged to, refresh it too so the Goal
  // column immediately reflects the removal instead of showing a stale state.
  if (engineerModalShipIndex != null) openEngineerModal(engineerModalShipIndex);
});

function moduleRow(m) {
  const nameCls = m.on === false ? 'module-name module-off' : 'module-name';
  const badges = [];
  if (m.engineered) {
    const atMax = m.maxGrade && m.grade >= m.maxGrade;
    badges.push(`<span class="module-grade-badge${atMax ? ' module-grade-max' : ''}">G${m.grade}${m.maxGrade ? '/' + m.maxGrade : ''}</span>`);
  }
  const detailBits = [];
  if (m.engineered) {
    if (m.blueprintName) detailBits.push(escapeHtml(m.blueprintName));
    if (m.engineer) detailBits.push('by ' + escapeHtml(m.engineer));
    if (m.effect) detailBits.push('✨ ' + escapeHtml(m.effect));
  }
  const detail = detailBits.length ? `<div class="module-detail">${detailBits.join(' · ')}</div>` : '';
  return `<div class="module-row${m.engineered ? ' module-row-engineered' : ''}">
    <div>
      <span class="${nameCls}">${escapeHtml(m.name)}</span>
      ${detail}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">${badges.join('')}</div>
  </div>`;
}

// A faint, light-grey ASCII-art watermark behind each card so a ship type is identifiable at a
// glance -- a lookup keyed by the exact real ship type display name (shipTypeName's output, e.g.
// "Python", "Anaconda", "Mandalay"), rendered behind each card (see .ship-ascii above). Left
// deliberately EMPTY for now -- populating it needs real reference screenshots per ship type,
// which don't exist here yet. All the rendering/stretch-to-fill plumbing (.ship-ascii-wrap,
// fitShipAscii) stays fully in place and just quietly does nothing until entries land here -- drop in
// `'Python': '...'` etc. keyed by ship type and it'll show up with no other code changes needed.
const SHIP_ASCII = {};
function shipAsciiArt(type) {
  return SHIP_ASCII[type] || '';
}

// Distance from your current position, per ship. Backend (shipyard.go) leaves distanceLy null
// when either your current position or that ship's system's coordinates aren't independently
// known --
// reported honestly here rather than guessed at.
function distanceLabel(s) {
  if (s.distanceLy == null) return 'distance unknown';
  if (s.distanceLy < 0.05) return 'here';
  return `${s.distanceLy.toFixed(1)} ly away`;
}

function shipCard(s, shipIndex) {
  const displayName = escapeHtml(s.name || s.type);
  const tag = s.ident ? `<span class="ship-tag">${escapeHtml(s.ident)}</span>` : '';
  const activeBadge = s.active ? '<span class="ship-active-badge">Active</span>' : '';
  const engineerableCount = s.hasModules ? s.modules.filter(m => m.engineerableType).length : 0;
  const engineerBtn = engineerableCount
    ? `<button type="button" class="engineer-ship-btn" data-ship-index="${shipIndex}" title="Plan engineering changes for this ship">⚙️ Engineer</button>`
    : '';
  const subBits = [escapeHtml(s.type)];
  if (s.system) subBits.push(escapeHtml(s.system));
  subBits.push(distanceLabel(s));
  subBits.push(formatCredits(s.value));
  // Only present when a real Loadout was recovered for this ship (0/omitted for an unrecovered
  // stored ship), so this just doesn't render rather than showing a fake "0.0 ly".
  const infoHtml = s.maxJumpRange
    ? `<div class="ship-info-row"><span>Jump range: <strong>${s.maxJumpRange.toFixed(1)} ly</strong></span></div>`
    : '';
  let completionHtml = '';
  if (s.hasModules && s.engineeredCount > 0 && s.completionPct != null) {
    completionHtml = `<div class="completion-row">
      <div class="completion-bar"><div class="completion-bar-fill" style="width:${Math.min(100, s.completionPct).toFixed(0)}%"></div></div>
      <span class="completion-label">${s.completionPct.toFixed(0)}% engineered</span>
    </div>`;
  }
  // Replaced an earlier <details>/<summary> "Modules (N)" expand button, which made the page look
  // cluttered, with a plain text hint instead: hovering shows a quick CSS-only preview
  // (.module-hover-preview), clicking opens the full list in a modal (openShipModulesModal).
  let bodyHtml;
  if (!s.hasModules) {
    bodyHtml = `<p class="no-modules-note">Build not recorded yet -- this ship's module loadout hasn't been independently confirmed since it was last flown (or its slot number may have been reused by a different ship since). Fly it once to refresh.</p>`;
  } else {
    const modulesInner = `<div class="module-list">${s.modules.map(moduleRow).join('')}</div>`;
    const snapshotNote = (!s.active && s.loadoutAt)
      ? `<p class="snapshot-note">Build as of ${escapeHtml(s.loadoutAt.replace('T', ' ').replace('Z', ''))} UTC -- the last time this ship was flown.</p>`
      : '';
    bodyHtml = `<div class="module-hint" data-ship-index="${shipIndex}">
      <span class="module-hint-label">🛠️ ${s.modules.length} modules</span>
      <div class="module-hover-preview">${modulesInner}${snapshotNote}</div>
    </div>`;
  }
  const ascii = shipAsciiArt(s.type);
  const asciiHtml = ascii
    ? `<div class="ship-ascii-wrap"><pre class="ship-ascii" aria-hidden="true">${escapeHtml(ascii)}</pre></div>`
    : '';
  return `<div class="ship-card${s.active ? ' ship-active' : ''}">
    ${asciiHtml}
    <div class="ship-card-fg">
      <div class="ship-head">
        <div class="ship-title">${displayName}${tag}</div>
        <div class="ship-head-actions">${activeBadge}${engineerBtn}</div>
      </div>
      <div class="ship-sub">${subBits.join(' · ')}</div>
      ${infoHtml}
      ${completionHtml}
      <div class="ship-card-spacer"></div>
      ${bodyHtml}
    </div>
  </div>`;
}

// Stretches each card's ASCII watermark (if any) to fill the whole card. Natural rendered size
// varies per art string, so the fill scale has to be computed per card rather than a single fixed
// CSS value; unequal x/y scale factors are expected (a deliberately distorted look), not a bug.
function fitShipAscii() {
  document.querySelectorAll('.ship-ascii-wrap').forEach(wrap => {
    const pre = wrap.querySelector('.ship-ascii');
    if (!pre) return;
    pre.style.transform = 'none';
    const naturalW = pre.scrollWidth, naturalH = pre.scrollHeight;
    if (!naturalW || !naturalH) return;
    const scaleX = wrap.clientWidth / naturalW;
    const scaleY = wrap.clientHeight / naturalH;
    pre.style.transform = `scale(${scaleX}, ${scaleY})`;
  });
}

// Real bug, fixed: the module-count hint sits at the bottom of each 16:9 card, and the hover
// preview's CSS default (see .module-hover-preview comment above) now opens upward to stay
// on-card in the common case -- but a card near the very TOP of the page (or window) can still run
// out of room upward, and a card in the right-most grid column can run the preview past the
// viewport's right edge. This measures actual available space on hover and flips/clamps only when
// the CSS default would genuinely go off-screen, so the preview can never land out of view
// regardless of where its card sits in the grid.
function positionModuleHoverPreview(hint) {
  const preview = hint.querySelector('.module-hover-preview');
  if (!preview) return;
  const hintRect = hint.getBoundingClientRect();
  const previewRect = preview.getBoundingClientRect(); // already reflects the CSS :hover state by the time this runs (see rAF below)
  const spaceAbove = hintRect.top;
  const spaceBelow = window.innerHeight - hintRect.bottom;
  if (spaceAbove < previewRect.height && spaceBelow > spaceAbove) {
    preview.style.bottom = 'auto';
    preview.style.top = '100%';
  } else {
    preview.style.top = 'auto';
    preview.style.bottom = '100%';
  }
  preview.style.left = '0';
  const afterRect = preview.getBoundingClientRect();
  let shift = 0;
  if (afterRect.right > window.innerWidth) shift = window.innerWidth - afterRect.right - 8;
  if (afterRect.left + shift < 0) shift = -afterRect.left + 8;
  preview.style.left = `${shift}px`;
}

function render() {
  if (!DATA.hasFleetData) {
    document.getElementById('fleetSection').innerHTML =
      `<div class="empty-note"><div class="empty-note-icon">🚀</div>No fleet data captured yet -- log in-game once (and open the Shipyard service at least once, to capture your stored ships too), then re-run this tool.</div>`;
    return;
  }
  document.getElementById('fleetSection').innerHTML = `<div class="fleet-grid">${DATA.ships.map(shipCard).join('')}</div>`;
  fitShipAscii();
  document.querySelectorAll('.module-hint').forEach(hint => {
    hint.addEventListener('mouseenter', () => requestAnimationFrame(() => positionModuleHoverPreview(hint)));
  });
}

function openShipModulesModal(shipIndex) {
  const ship = DATA.ships[shipIndex];
  if (!ship) return;
  document.getElementById('shipModulesModalTitle').textContent = `${ship.name || ship.type} -- modules`;
  document.getElementById('shipModulesModalSub').textContent = ship.type + (ship.ident ? ` -- ${ship.ident}` : '');
  if (!ship.hasModules) {
    document.getElementById('shipModulesModalBody').innerHTML = `<p class="no-modules-note">Build not recorded yet -- this ship's module loadout hasn't been independently confirmed since it was last flown (or its slot number may have been reused by a different ship since). Fly it once to refresh.</p>`;
  } else {
    const snapshotNote = (!ship.active && ship.loadoutAt)
      ? `<p class="snapshot-note">Build as of ${escapeHtml(ship.loadoutAt.replace('T', ' ').replace('Z', ''))} UTC -- the last time this ship was flown.</p>`
      : '';
    document.getElementById('shipModulesModalBody').innerHTML = `<div class="module-list" style="max-height:60vh">${ship.modules.map(moduleRow).join('')}</div>${snapshotNote}`;
  }
  document.getElementById('shipModulesModalOverlay').hidden = false;
}
function closeShipModulesModal() {
  document.getElementById('shipModulesModalOverlay').hidden = true;
}
document.getElementById('shipModulesModalClose').addEventListener('click', closeShipModulesModal);
document.getElementById('shipModulesModalOverlay').addEventListener('click', e => {
  if (e.target.id === 'shipModulesModalOverlay') closeShipModulesModal();
});
document.getElementById('fleetSection').addEventListener('click', e => {
  const label = e.target.closest('.module-hint-label');
  if (!label) return;
  openShipModulesModal(Number(label.closest('.module-hint').dataset.shipIndex));
});
window.addEventListener('resize', fitShipAscii);

// ---- "⚙️ Engineer" modal -- replaces an earlier per-module inline "+ Plan G_" button design
// (a button scattered into every module row read as fiddly) with one deliberate action per ship
// instead.
//
// Shows two columns side by side, same module order in both so they line up: "Current Ship"
// (read-only, real state) and "Goal Ship" (editable -- shows whatever goal has been set for that
// slot, or lets you set one), plus a header comparing the ship's real completion % against what
// it would be once every set goal is done.
let engineerModalShipIndex = null;

function gradeOptionsHtml(maxGrade, selected) {
  const opts = [];
  for (let g = 1; g <= maxGrade; g++) opts.push(`<option value="${g}"${g === selected ? ' selected' : ''}>Grade ${g}</option>`);
  return opts.join('');
}
function maxGradeForType(type, name) {
  const opt = (DATA.blueprintsByType[type] || []).find(o => o.name === name);
  return opt ? opt.maxGrade : 0;
}

// goalCompletionPct: same gradeSum/maxSum formula the backend already uses for a ship's real
// completionPct (shipyard.go), recomputed here with each slot's GOAL grade substituted in where
// one has been set -- a slot with no goal still counts using its real current grade/max (same as
// today), so "finishing your ship" means completing every goal you've actually set, not every
// module that could theoretically be touched.
function goalCompletionPct(ship) {
  let gradeSum = 0, maxSum = 0;
  ship.modules.forEach(m => {
    if (!m.engineerableType) return;
    const g = goals[goalKey(ship, m)];
    if (g) {
      const maxGrade = maxGradeForType(g.type, g.name);
      if (maxGrade > 0) { gradeSum += g.toGrade; maxSum += maxGrade; }
    } else if (m.engineered && m.maxGrade > 0) {
      gradeSum += m.grade; maxSum += m.maxGrade;
    }
  });
  return maxSum > 0 ? (gradeSum / maxSum * 100) : null;
}

// Left column: read-only, exactly the ship's real state -- no controls, just for comparison.
function currentModuleRow(m) {
  const state = m.engineered ? `Grade ${m.grade}${m.maxGrade ? '/' + m.maxGrade : ''}` : 'Not engineered';
  const detailBits = [];
  if (m.engineered) {
    if (m.blueprintName) detailBits.push(escapeHtml(m.blueprintName));
    if (m.effect) detailBits.push('✨ ' + escapeHtml(m.effect));
  }
  return `<div class="compare-module-row">
    <div class="compare-module-name">${escapeHtml(m.name)}</div>
    <div class="compare-module-state">${escapeHtml(state)}</div>
    ${detailBits.length ? `<div class="compare-module-detail">${detailBits.join(' · ')}</div>` : ''}
  </div>`;
}

// Right column: shows the current goal for this slot (if any) as a highlighted badge, plus the
// picker to set/change/clear it. Pre-fills to the EXISTING goal when one's already set (so
// re-opening shows what you picked, not a reset default), otherwise the same "current+1, or max
// if starting fresh" default the old single-column version already used.
function goalModuleRow(ship, m, moduleIndex) {
  const options = (DATA.blueprintsByType[m.engineerableType] || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  if (!options.length) {
    // Always emit a paired cell (never '') so the current/goal grid alternation for every
    // module after this one doesn't shift out of alignment.
    return `<div class="compare-module-row"><div class="compare-module-name">${escapeHtml(m.name)}</div>
      <div class="compare-module-state">No engineering blueprints known for this module type.</div></div>`;
  }
  const key = goalKey(ship, m);
  const existingGoal = goals[key];
  const selectedName = existingGoal ? existingGoal.name
    : (m.blueprintName && options.some(o => o.name === m.blueprintName) ? m.blueprintName : options[0].name);
  const selectedOpt = options.find(o => o.name === selectedName) || options[0];
  const defaultGrade = existingGoal ? existingGoal.toGrade
    : ((m.engineered && m.blueprintName === selectedName && m.grade < selectedOpt.maxGrade) ? m.grade + 1 : selectedOpt.maxGrade);
  const effects = (DATA.effectsByType[m.engineerableType] || []).slice().sort((a, b) => a.localeCompare(b));
  const defaultEffect = existingGoal ? (existingGoal.effect || '') : (m.effect || '');
  const badge = existingGoal
    ? `<div class="goal-badge">🎯 Goal: Grade ${existingGoal.toGrade} ${escapeHtml(existingGoal.name)}${existingGoal.effect ? ' · ✨ ' + escapeHtml(existingGoal.effect) : ''}</div>`
    : '<div class="goal-badge goal-badge-unset">No goal set yet</div>';
  return `<div class="engineer-module-row compare-goal-cell" data-module-index="${moduleIndex}" data-goal-key="${escapeHtml(key)}">
    <div class="engineer-module-head">
      <span class="engineer-module-name">${escapeHtml(m.name)}</span>
    </div>
    ${badge}
    <div class="engineer-module-controls">
      <select class="engineer-name-select" data-module-index="${moduleIndex}">
        ${options.map(o => `<option value="${escapeHtml(o.name)}" data-max-grade="${o.maxGrade}"${o.name === selectedName ? ' selected' : ''}>${escapeHtml(o.name)}</option>`).join('')}
      </select>
      <select class="engineer-grade-select" data-module-index="${moduleIndex}">
        ${gradeOptionsHtml(selectedOpt.maxGrade, defaultGrade)}
      </select>
      <select class="engineer-effect-select" data-module-index="${moduleIndex}">
        <option value="">No effect</option>
        ${effects.map(e => `<option value="${escapeHtml(e)}"${defaultEffect === e ? ' selected' : ''}>${escapeHtml(e)}</option>`).join('')}
      </select>
      <button type="button" class="engineer-add-btn" data-module-index="${moduleIndex}" data-type="${escapeHtml(m.engineerableType)}"
        data-current-name="${escapeHtml(m.blueprintName || '')}" data-current-grade="${m.engineered ? m.grade : 0}">${existingGoal ? 'Update Goal' : 'Set Goal'}</button>
      ${existingGoal ? `<button type="button" class="goal-clear-btn" data-goal-key="${escapeHtml(key)}" title="Clear this goal">✕</button>` : ''}
    </div>
  </div>`;
}

// Export to Coriolis/EDSY. Verified directly against each site's own real open-source code (not
// guessed): EDCD/coriolis's Coriolis.jsx
// registers a real '/import/:data' route whose handler, when the decoded JSON has a real
// `Modules` array (a real journal Loadout shape, not Coriolis's own separate "SLEF"/Companion-API
// shapes), calls JournalUtils.shipFromLoadoutJSON(json) directly -- i.e. Coriolis's own official
// importer already knows how to parse the EXACT raw Loadout event JSON this project already has,
// no translation needed. taleden/EDSY's own real 'import' handler documents the same thing --
// among its accepted inputs is "Journal JSONL data with 'Loadout' events" -- via an `import` query
// parameter carrying zlib-deflate-compressed, base64 data. Both sites expect zlib-format deflate
// (RFC1950), which is exactly what the browser's native CompressionStream('deflate') produces --
// no external compression library needed, in keeping with this page's "no dependencies" bar.
async function deflateToBase64(text) {
  const cs = new CompressionStream('deflate');
  const writer = cs.writable.getWriter();
  writer.write(new TextEncoder().encode(text));
  writer.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function normalizeBase64(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return s;
}
async function inflateFromBase64(b64) {
  const binary = atob(normalizeBase64(b64));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const ds = new DecompressionStream('deflate');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new TextDecoder().decode(buf);
}
function exportButtonsHtml(ship) {
  if (!ship.rawLoadoutJson || typeof CompressionStream === 'undefined') return '';
  return `<button type="button" class="export-btn" data-export-site="coriolis">🚀 Export to Coriolis</button>
    <button type="button" class="export-btn" data-export-site="edsy">🚀 Export to EDSY</button>`;
}
document.getElementById('engineerExportRow').addEventListener('click', async e => {
  const btn = e.target.closest('.export-btn');
  if (!btn) return;
  const ship = DATA.ships[engineerModalShipIndex];
  if (!ship || !ship.rawLoadoutJson) return;
  const site = btn.dataset.exportSite;
  const original = btn.textContent;
  let url;
  try {
    const b64 = await deflateToBase64(ship.rawLoadoutJson);
    if (site === 'coriolis') {
      // Real bug, fixed: the previous version used '/import/<data>' (data as a raw PATH segment).
      // Standard base64 can contain '/', and even percent-encoded as %2F, some client-side routers
      // decode the full path before splitting on '/' -- silently truncating the data and 404ing.
      // Coriolis's own router also registers a bare '/import' route (confirmed in its real
      // source), which reads the same data from a query string instead -- avoids the whole
      // path-segment ambiguity, so used here.
      url = `https://coriolis.io/import?data=${encodeURIComponent(b64)}`;
    } else {
      const urlSafe = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      url = `https://edsy.org/import?import=${encodeURIComponent(urlSafe)}`;
    }
  } catch (err) {
    btn.textContent = '✗ Failed';
    setTimeout(() => { btn.textContent = original; }, 2000);
    return;
  }
  copyToClipboard(url).then(ok => {
    btn.textContent = ok ? '✓ Copied' : '✗ Failed';
    btn.classList.add(ok ? 'copied' : 'copy-failed');
    setTimeout(() => { btn.textContent = original; btn.classList.remove(ok ? 'copied' : 'copy-failed'); }, ok ? 1400 : 2500);
  });
});

// Import from Coriolis/EDSY -- so a pasted build link can update the goal ship directly, making
// it easier to track builds and work towards them. Decodes the SAME '/import/'-deep-link shape
// the Export buttons above produce -- deliberately NOT each site's own compact build-share code
// (Coriolis's '/outfit/:ship/:code', EDSY's own equivalent native code), since those depend on
// each site's own large internal per-module ID catalog that isn't loaded here and would risk
// silently mismapping a module if guessed at. A real, honest limitation, not an oversight.
// Real bug, fixed: pasting a real Coriolis/EDSY build link (Coriolis's
// own '/outfit/:ship?code=...' share format, EDSY's own '#/L=...' share format -- their NORMAL
// "share this build" links, not the /import/ deep-link this page's own Export buttons produce)
// used to get a misleading "not recognized" message, as if the link were garbage. It's a real,
// valid link -- just in a different, much more complex format (each site's own internal
// per-module ID/bit-packing scheme, backed by a large separate data catalog neither site
// publishes as a simple lookup table) that isn't safely decodable here without risking a silently
// wrong result. Now recognized (and clearly explained) as "real link, unsupported format" rather
// than lumped in with actually-invalid input.
function parseExportedUrl(raw) {
  const s = (raw || '').trim();
  let m = s.match(/coriolis\.io\/import\?(?:.*[?&])?data=([^&#]+)/i);
  if (m) return { site: 'Coriolis', data: decodeURIComponent(m[1]), urlSafe: false };
  m = s.match(/coriolis\.io\/import\/([^/?#]+)/i);
  if (m) return { site: 'Coriolis', data: decodeURIComponent(m[1]), urlSafe: false };
  m = s.match(/edsy\.org\/(?:dev\/)?import\?(?:.*[?&])?import=([^&#]+)/i);
  if (m) return { site: 'EDSY', data: decodeURIComponent(m[1]), urlSafe: true };
  // Coriolis's own compact share format puts the ship type right in the URL PATH as a plain
  // slug (e.g. "/outfit/panthermkii?code=..."), readable with no decoding at all -- pure URL
  // parsing, not the site's actual proprietary bit-packed module encoding (which this project
  // still doesn't attempt, see docs/ShipyardPlanner.md for why). Surfaced so an import attempt on
  // a compact link can at least confirm/deny "this build is for the right kind of ship" for free.
  m = s.match(/coriolis\.io\/outfit\/([a-z0-9_-]+)/i);
  if (m) return { site: 'Coriolis', compact: true, shipSlug: m[1] };
  if (/edsy\.org\/.*#\/?L=/i.test(s) || /edsy\.org\/#/i.test(s)) return { site: 'EDSY', compact: true };
  return null;
}

// resolveModuleTypeJS: JS port of shipmodulenames.go's resolveModuleType, driven by the SAME
// keyword table (DATA.moduleTypeKeywords/nonEngineerableItemPrefixes/engineItemInfix) rather than
// a second hand-maintained copy -- this project generates fully static HTML with no live backend,
// so a pasted build's real Item symbols (which may be types this commander's own fleet has never
// used) need this resolution available client-side too. Same HasPrefix/Contains logic, same
// longest-keyword-first ordering, no case-folding (real journal Item symbols are already
// consistently lowercase, matching the Go side's own assumption).
const moduleTypeSortedKeywordsJS = Object.keys(DATA.moduleTypeKeywords || {}).sort((a, b) => b.length - a.length);
function resolveModuleTypeJS(item) {
  if (!item) return '';
  for (const prefix of (DATA.nonEngineerableItemPrefixes || [])) {
    if (item.startsWith(prefix)) return '';
  }
  if (DATA.engineItemInfix && item.includes(DATA.engineItemInfix)) return 'Thrusters';
  for (const kw of moduleTypeSortedKeywordsJS) {
    if (item.includes(kw)) return DATA.moduleTypeKeywords[kw];
  }
  return '';
}

// resolveBlueprintSymbolJS/resolveExperimentalEffectSymbolJS: JS ports of
// shipmodulemaps.go's resolveBlueprintSymbol/resolveExperimentalEffectSymbol. Real bug caught
// during verification: a pasted build's raw Engineering.BlueprintName/ExperimentalEffect are the
// game's own internal symbols ("FSD_LongRange", "special_armour_chunky"), NOT this project's own
// display names ("Increased FSD Range", "Deep Plating") -- a naive display-name string comparison
// silently matched nothing on a real self-import round-trip test. Driven by the same
// DATA.blueprintSymbolMap/experimentalEffectSymbolMap the server resolves through, same
// slotType-first-then-only-candidate-if-unambiguous logic.
function resolveBlueprintSymbolJS(symbol, slotType) {
  const candidates = (DATA.blueprintSymbolMap || {})[(symbol || '').toLowerCase()];
  if (!candidates) return null;
  if (candidates[slotType]) return candidates[slotType];
  const keys = Object.keys(candidates);
  if (keys.length === 1) return candidates[keys[0]];
  return null;
}
function resolveExperimentalEffectSymbolJS(symbol, slotType) {
  const candidates = (DATA.experimentalEffectSymbolMap || {})[(symbol || '').toLowerCase()];
  if (!candidates) return null;
  if (candidates[slotType]) return candidates[slotType];
  const keys = Object.keys(candidates);
  if (keys.length === 1) return candidates[keys[0]];
  return null;
}

function showImportResult(cls, text) {
  const el = document.getElementById('engineerImportResult');
  el.className = `import-result import-visible ${cls}`;
  el.textContent = text;
}

async function importFromUrl() {
  const ship = DATA.ships[engineerModalShipIndex];
  if (!ship) return;
  const input = document.getElementById('engineerImportInput');
  const parsed = parseExportedUrl(input.value);
  if (!parsed) {
    showImportResult('import-error', "That doesn't look like a Coriolis or EDSY link at all -- paste a real coriolis.io or edsy.org URL.");
    return;
  }
  if (parsed.compact) {
    // Real, deliberate scope limit -- see docs/ShipyardPlanner.md: fully decoding either site's
    // own compact build-share code needs their own large internal per-module ID catalog and (for
    // Coriolis) a further nested engineering-modifications sub-format; guessing at it risks
    // silently setting wrong goals, so it isn't attempted. The ship-type slug in a Coriolis
    // compact URL's own PATH is plain, undecoded text though (e.g. ".../outfit/python?code=..."),
    // so it's surfaced here for free as a sanity check -- not a full import.
    const slugNote = parsed.shipSlug ? ` (this link's own URL says it's for a "${parsed.shipSlug}" hull)` : '';
    showImportResult('import-error', `That's a real ${parsed.site} link${slugNote} -- but it's in ${parsed.site}'s own compact build-share code format, which this page can't decode yet (it depends on ${parsed.site}'s own large internal per-module ID catalog, and guessing at it risks silently setting wrong goals). Only /import/ deep links -- like the ones this page's own Export buttons produce -- can be imported right now.`);
    return;
  }
  if (typeof DecompressionStream === 'undefined') {
    showImportResult('import-error', "Your browser doesn't support decompression -- try a recent Chrome, Firefox, or Safari.");
    return;
  }
  let json;
  try {
    json = JSON.parse(await inflateFromBase64(parsed.data));
  } catch (err) {
    showImportResult('import-error', 'Could not decode that link -- it may be corrupted, or in a format this page doesn\'t support.');
    return;
  }
  if (!json || !Array.isArray(json.Modules) || !json.Ship) {
    showImportResult('import-error', "That decoded, but doesn't look like a real ship Loadout -- nothing was imported.");
    return;
  }
  if (ship.shipSymbol && json.Ship.toLowerCase() !== ship.shipSymbol.toLowerCase()) {
    showImportResult('import-error', `That build is for a different ship type (${json.Ship}) than this ship's real type (${ship.shipSymbol}) -- nothing was imported, to avoid setting mismatched goals.`);
    return;
  }

  // Match by resolved TYPE, not raw slot name -- Coriolis/EDSY's own slot identifiers don't
  // correspond to this project's Loadout-derived Slot strings.
  const decodedByType = {};
  json.Modules.forEach(m => {
    const type = resolveModuleTypeJS(m.Item || '');
    if (!type) return;
    (decodedByType[type] = decodedByType[type] || []).push(m);
  });
  const targetByType = {};
  ship.modules.forEach((m, i) => {
    if (!m.engineerableType) return;
    (targetByType[m.engineerableType] = targetByType[m.engineerableType] || []).push({ m, i });
  });

  let imported = 0;
  const skipped = [];
  Object.keys(targetByType).forEach(type => {
    const decodedList = decodedByType[type];
    if (!decodedList || !decodedList.length) return; // this ship has a slot type the pasted build doesn't touch -- leave it alone
    const targets = targetByType[type];
    // Zip by slot order when a type appears more than once (e.g. multiple Cargo Racks, or several
    // hardpoints of the same weapon type) -- not guaranteed correct for ships where several
    // same-type slots serve different roles, but there's no other real signal to match on, since
    // Coriolis/EDSY's own slot IDs don't map onto this project's real Slot strings.
    const n = Math.min(decodedList.length, targets.length);
    for (let k = 0; k < n; k++) {
      const dm = decodedList[k];
      const target = targets[k];
      const eng = dm.Engineering;
      if (!eng || !eng.BlueprintName) { skipped.push(`${type} (not engineered in the pasted build)`); continue; }
      // eng.BlueprintName/ExperimentalEffect are the game's own raw internal symbols (e.g.
      // "FSD_LongRange"), not this project's own display names -- resolve through the same real
      // symbol maps buildModuleOut uses server-side, not a naive display-name string compare.
      const resolvedName = resolveBlueprintSymbolJS(eng.BlueprintName, type);
      if (!resolvedName) { skipped.push(`${type} -- "${eng.BlueprintName}" (blueprint symbol doesn't resolve against this project's own catalog)`); continue; }
      const options = DATA.blueprintsByType[type] || [];
      const match = options.find(o => o.name === resolvedName);
      if (!match) { skipped.push(`${type} -- "${resolvedName}" (resolved, but no matching grade rows in this project's own catalog)`); continue; }
      const toGrade = Math.min(eng.Level || 1, match.maxGrade);
      const effectMatch = eng.ExperimentalEffect ? (resolveExperimentalEffectSymbolJS(eng.ExperimentalEffect, type) || '') : '';
      const fromGrade = (target.m.engineered && target.m.blueprintName === match.name) ? target.m.grade : 0;
      setGoal(ship, target.m, target.i, type, match.name, toGrade, effectMatch, fromGrade);
      imported++;
    }
    if (decodedList.length > targets.length) skipped.push(`${type} (pasted build has more of this type than this ship does -- extra ones skipped)`);
  });

  if (imported === 0) {
    showImportResult('import-error', `Nothing importable found for this ship (checked ${Object.keys(targetByType).length} engineerable module type${Object.keys(targetByType).length === 1 ? '' : 's'}).`);
    return;
  }
  openEngineerModal(engineerModalShipIndex); // refresh the Goal column with the newly-set goals
  const summary = `Imported ${imported} module goal${imported === 1 ? '' : 's'} from ${parsed.site}.` + (skipped.length ? ` Skipped: ${skipped.join('; ')}.` : '');
  showImportResult(skipped.length ? 'import-partial' : 'import-ok', summary);
}
document.getElementById('engineerImportBtn').addEventListener('click', importFromUrl);

function openEngineerModal(shipIndex) {
  const ship = DATA.ships[shipIndex];
  if (!ship || !ship.hasModules) return;
  engineerModalShipIndex = shipIndex;
  const engineerable = ship.modules.map((m, i) => ({ m, i })).filter(x => x.m.engineerableType);
  document.getElementById('engineerExportRow').innerHTML = exportButtonsHtml(ship);
  document.getElementById('engineerModalTitle').textContent = `⚙️ Engineer -- ${ship.name || ship.type}`;
  const curPct = ship.completionPct != null ? ship.completionPct.toFixed(0) : null;
  const goalPct = goalCompletionPct(ship);
  const pctText = curPct != null || goalPct != null
    ? ` Current ${curPct != null ? curPct : '0'}% engineered → Goal ${goalPct != null ? goalPct.toFixed(0) : '0'}% engineered.`
    : '';
  document.getElementById('engineerModalSub').textContent = `${ship.type} -- compare your real build against what it'll be once your goals are done.${pctText}`;
  if (!engineerable.length) {
    document.getElementById('engineerModalBody').innerHTML = `<p class="empty-note">No engineerable modules found on this ship.</p>`;
  } else {
    // One flat grid, alternating current-cell/goal-cell per module (titles first) -- NOT two
    // independent stacked columns -- so each module's pair shares a grid row and can never drift
    // out of alignment regardless of which cell is taller. See .compare-columns comment above.
    document.getElementById('engineerModalBody').innerHTML = `
      <div class="compare-columns">
        <div class="compare-column-title">Current Ship</div>
        <div class="compare-column-title">Goal Ship</div>
        ${engineerable.map(x => currentModuleRow(x.m) + goalModuleRow(ship, x.m, x.i)).join('')}
      </div>`;
  }
  document.getElementById('engineerModalOverlay').hidden = false;
}
function closeEngineerModal() {
  document.getElementById('engineerModalOverlay').hidden = true;
  engineerModalShipIndex = null;
}
document.getElementById('engineerModalClose').addEventListener('click', closeEngineerModal);
document.getElementById('engineerModalOverlay').addEventListener('click', e => {
  if (e.target.id === 'engineerModalOverlay') closeEngineerModal();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeEngineerModal();
  closeMaterialsPanel();
  closeShipModulesModal();
  closeTradeModal();
});

// Name select changing re-populates that same row's Grade select (cascading, same pattern as the
// engineering planner's own Type/Name -> Grade picker) -- delegated since rows are rebuilt often.
document.getElementById('engineerModalBody').addEventListener('change', e => {
  if (!e.target.classList.contains('engineer-name-select')) return;
  const idx = e.target.dataset.moduleIndex;
  const selectedOption = e.target.selectedOptions[0];
  const maxGrade = Number(selectedOption.dataset.maxGrade);
  const gradeSelect = document.querySelector(`.engineer-grade-select[data-module-index="${idx}"]`);
  gradeSelect.innerHTML = gradeOptionsHtml(maxGrade, maxGrade);
});

document.getElementById('engineerModalBody').addEventListener('click', e => {
  const clearBtn = e.target.closest('.goal-clear-btn');
  if (clearBtn) {
    clearGoalByKey(clearBtn.dataset.goalKey);
    openEngineerModal(engineerModalShipIndex); // refresh both columns + the header % immediately
    return;
  }
  const btn = e.target.closest('.engineer-add-btn');
  if (!btn) return;
  const idx = btn.dataset.moduleIndex;
  const type = btn.dataset.type;
  const name = document.querySelector(`.engineer-name-select[data-module-index="${idx}"]`).value;
  const grade = Number(document.querySelector(`.engineer-grade-select[data-module-index="${idx}"]`).value);
  const effect = document.querySelector(`.engineer-effect-select[data-module-index="${idx}"]`).value;
  // Real game mechanic: switching to a DIFFERENT blueprint than what's currently applied starts
  // that blueprint's own progression from scratch, even if the module already has some other
  // engineering on it -- only sticking with the SAME currently-applied blueprint carries its
  // current grade forward. See the goals/GOALS_STORAGE_KEY comment above for why this matters.
  const fromGrade = (btn.dataset.currentName === name) ? Number(btn.dataset.currentGrade) : 0;
  const ship = DATA.ships[engineerModalShipIndex];
  const m = ship.modules[Number(idx)];
  setGoal(ship, m, Number(idx), type, name, grade, effect, fromGrade);
  openEngineerModal(engineerModalShipIndex); // refresh both columns + the header % immediately
});

document.getElementById('fleetSection').addEventListener('click', e => {
  const btn = e.target.closest('.engineer-ship-btn');
  if (!btn) return;
  // Fresh ship -- clear any leftover import text/result from a previous ship's modal session.
  // (openEngineerModal itself is also reused to refresh the SAME ship's modal in place after a
  // goal changes, so this reset intentionally lives here, not inside openEngineerModal, or a
  // just-shown import confirmation message would get wiped out by its own refresh call.)
  document.getElementById('engineerImportInput').value = '';
  const resultEl = document.getElementById('engineerImportResult');
  resultEl.className = 'import-result';
  resultEl.textContent = '';
  openEngineerModal(Number(btn.dataset.shipIndex));
});

render();
updateMaterialsBtn();
</script>
