  color-scheme: light;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;

  --transition: 160ms ease;
  --bg: #f9f9f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --muted-faint: #898781;
  --border: #e1e0d9; --border-strong: #c3c2b7; --accent: #2a78d6; --accent-weak: #e6f0fc;
  --good: #0ca30c; --good-bg: #e5f7e5; --warning: #b5710a; --warning-bg: #fdf1de;
  --bonus-bg: #fdf1d3; --bonus-text: #7a5a00;

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d12; --panel: #15181d; --text: #f2f3f5; --muted: #b7bcc4; --muted-faint: #7c828b;
  --border: #262a31; --border-strong: #343a43; --accent: #3987e5; --accent-weak: #17233a;
  --good: #3ecf3e; --good-bg: #12291a; --warning: #e0a53c; --warning-bg: #2e2312;
  --bonus-bg: #3d3110; --bonus-text: #f0c766;
  --notable-bg: #2c2140; --notable-text: #caa9f7;
  --bad-bg: #3a1f1f; --bad-text: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 8px 20px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.045);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); padding: var(--space-5); font-variant-numeric: tabular-nums; }
.page-nav { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.page-nav-link { font-size: 0.85rem; color: var(--muted); text-decoration: none; padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-pill); border: 1px solid var(--border); transition: border-color var(--transition), color var(--transition); }
.page-nav-link:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.page-nav-link.page-nav-active { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); font-weight: 600;
  box-shadow: 0 2px 10px -4px color-mix(in srgb, var(--accent) 50%, transparent); }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; display: inline-block; }
.header-row { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 var(--space-5); }
.copy-btn { background: var(--accent); color: white; border: 1px solid transparent; border-radius: var(--radius-pill);
  padding: 4px var(--space-4); font-size: 0.82rem; cursor: pointer;
  transition: background-color var(--transition), transform var(--transition), box-shadow var(--transition); }
.copy-btn:hover { background: color-mix(in srgb, var(--accent) 85%, black); transform: translateY(-1px);
  box-shadow: 0 4px 10px -4px color-mix(in srgb, var(--accent) 55%, transparent); }
.copy-btn:active { transform: translateY(1px); box-shadow: none; }
.copy-btn.copied { background: var(--good); }
.copy-btn.copy-failed { background: var(--bad-text); }
.copy-btn-small { background: transparent; color: var(--muted); border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
  padding: 2px var(--space-3); font-size: 0.72rem; font-weight: 400; cursor: pointer; transition: background-color var(--transition), color var(--transition), border-color var(--transition); }
.copy-btn-small:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.copy-btn-small.copied { color: white; background: var(--good); border-color: var(--good); }
.copy-btn-small.copy-failed { color: white; background: var(--bad-text); border-color: var(--bad-text); }
.highlights { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-5); }
.highlight { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow); font-size: 0.9rem; }
.highlight-date { font-size: 0.74rem; color: var(--muted); margin-top: 3px; }
/* A compact highlight strip (not the full exhaustive per-category breakdown the rest of this page
   already has) scoped to just the most recent play session, sitting ahead of the all-time recap
   since it's the most immediately relevant thing right after actually playing. Reuses the exact
   same recapStat data shape as the all-time sections below -- just a curated subset of the
   session's own non-zero stats, picked by pickSessionHighlights (see JS below) rather than every
   stat at once. */
.session-recap { background: var(--accent-weak); border: 1px solid var(--accent); border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5); margin-bottom: var(--space-5); box-shadow: var(--shadow); }
.session-recap-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.session-recap-range { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
.session-recap-empty { font-size: 0.85rem; color: var(--muted); margin-top: var(--space-2); }
.session-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); margin-top: var(--space-3); }
.session-stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3); box-shadow: var(--shadow); }
.session-stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.session-stat-value { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; margin-top: 2px; }
.session-stat-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.section { margin-bottom: var(--space-6); }
.section-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 var(--space-3); padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.03em;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.section-title button { text-transform: none; letter-spacing: normal; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-3); }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-4); box-shadow: var(--shadow); transition: transform var(--transition), box-shadow var(--transition); }
/* Real bug, fixed: this rule's specificity (class + :hover = 0,2,0) beat .stat-card-danger/
   .stat-card-rare's own transform rule below (0,1,0) whenever a special card was actually
   hovered -- so the elaborate perspective/tilt/lift/scale chain got silently overridden by this
   plain 1px lift the whole time, which is why "card doesnt actually lift up at all" (1px was all
   that was ever rendering). Excluded special cards here so they're driven entirely by their own
   custom-property-based rule instead of fighting this one. */
.stat-card:not(.stat-card-danger):not(.stat-card-rare):hover { transform: translateY(-1px); box-shadow: var(--shadow), 0 6px 14px -8px color-mix(in srgb, var(--accent) 25%, transparent); }
/* A pulsing red glow on whichever stat card carries recapStat.Danger (currently just a genuinely
   dramatic "Closest call" hull-health reading, <=10%). Pure CSS animation, no JS/library needed,
   staying as lightweight as the rest of this page. */
@keyframes danger-pulse {
  0%, 100% { box-shadow: var(--shadow), 0 0 0 0 color-mix(in srgb, var(--bad-text) 55%, transparent); }
  50% { box-shadow: var(--shadow), 0 0 20px 3px color-mix(in srgb, var(--bad-text) 55%, transparent); }
}
.stat-card.stat-card-danger, .session-stat-card.stat-card-danger {
  border-color: var(--bad-text); animation: danger-pulse 1.8s ease-in-out infinite;
}
.stat-card.stat-card-danger .stat-value, .session-stat-card.stat-card-danger .session-stat-value {
  color: var(--bad-text);
}
/* A second flag (Rare, e.g. Notable/rare finds) sharing this same hover treatment but without
   Danger's red tint.
   Real bug, fixed: the first version triggered a fixed-length CSS `:hover` keyframe animation
   (900ms wobble+shine, then stop), which only ever plays once per hover instead of continuously
   tracking the cursor. A real foil/holographic trading-card effect has to track the actual cursor
   position continuously, not just play a
   canned animation once on hover-enter. Rebuilt as real mousemove-driven CSS custom properties
   (--holo-px/--holo-py position the shine's radial-gradient center, --holo-rx/--holo-ry drive a
   3D tilt via rotateX/rotateY) updated live by JS (see wireHoloCards below) -- still pure CSS
   for the actual rendering (transform/gradient), just fed live values instead of a fixed
   keyframe, so the shine and tilt genuinely follow the cursor the whole time it's over the card,
   the same way a real foil card catches light as you turn it. */
.stat-card.stat-card-rare, .session-stat-card.stat-card-rare {
  border-color: var(--notable-text);
}
.stat-card.stat-card-rare .stat-value, .session-stat-card.stat-card-rare .session-stat-value {
  color: var(--notable-text);
}
/* The full foil shine used to fire at the same 10% hull-health bar as the red pulsing outline --
   too lenient a threshold for something meant to read as genuinely extreme. Danger alone (10%,
   see .stat-card.stat-card-danger above) still gets the red border/pulse; the shine/tilt/lift
   mechanic below now keys off the stricter .stat-card-danger-extreme (<=1%, recapStat's own
   DangerExtreme) instead of plain .stat-card-danger. */
.stat-card-danger-extreme, .stat-card-rare, .stat-card-elite-max {
  position: relative; overflow: hidden; will-change: transform;
  transition: transform 120ms ease-out, box-shadow 200ms ease-out;
  transform: perspective(700px) rotateX(calc(var(--holo-ry, 0) * 1deg)) rotateY(calc(var(--holo-rx, 0) * 1deg))
    translateY(var(--holo-lift, 0px)) scale(var(--holo-scale, 1));
}
.stat-card-danger-extreme::after, .stat-card-rare::after, .stat-card-elite-max::after {
  content: ''; position: absolute; inset: -20%; pointer-events: none;
  opacity: var(--holo-opacity, 0); transition: opacity 200ms ease-out;
  background-size: 250% 250%;
  background-position: calc(50% - var(--holo-rx, 0) * 3.2%) calc(50% - var(--holo-ry, 0) * 3.2%);
}
.stat-card-danger-extreme.holo-active, .stat-card-rare.holo-active, .stat-card-elite-max.holo-active {
  z-index: 2; box-shadow: var(--shadow), 0 20px 34px -12px color-mix(in srgb, var(--accent) 50%, transparent);
}
/* Tints each card type off its own real theme color instead of one shared hardcoded gradient, and
   tones the intensity down -- a shared gradient read as too bright and the wrong color on some
   card types.
   Second real fix, same effect: the shine used to be centered on the raw cursor position, which
   read as a flashlight following the mouse rather than light reflecting off a surface. A real
   foil card's glint comes from a FIXED light source catching the surface at whatever angle it's
   currently tilted to, not a spotlight glued to the cursor. Re-keyed the shine's
   `background-position` off the TILT (--holo-rx/--holo-ry,
   the same values driving the rotation) instead of the raw cursor position (--holo-px/--holo-py,
   no longer used here) -- as the card rotates, the diagonal sheen band sweeps across it like real
   light reflecting off an angled surface, decoupled from exactly where the cursor happens to be.
   Also gave the "coming out" pop real presence: a live --holo-lift (translateY) alongside the
   existing scale, and a stronger shadow while active, so it genuinely reads as lifting off the
   page and tilting, not just a static hover color change. */
.stat-card-danger-extreme::after {
  background-image: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.55) 48%,
    color-mix(in srgb, var(--bad-text) 60%, transparent) 52%, transparent 62%);
}
.stat-card-rare::after {
  background-image: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.55) 48%,
    color-mix(in srgb, var(--notable-text) 60%, transparent) 52%, transparent 62%);
}
/* EliteTier 1-6 (see recapStat's own comment: 1 = "Elite" itself, 6 = max prestige "Elite V")
   sets a real per-card --elite-tier custom property the template inlines; the gold border/glow
   intensity scales continuously with it via calc(), and only at the true max tier (6, "Elite V")
   does the card additionally get .stat-card-elite-max, which reuses the exact same transform/
   shine mechanic as Danger/Rare above (added to their shared selectors below) but gold-tinted for
   the full foil treatment. Not verified against this commander's own real data (their own highest
   real rank is nowhere near Elite yet, confirmed against their real Combat rank "Competent"
   level 3/13) -- verified with a synthetic mock instead. */
.stat-card-elite {
  border-color: color-mix(in srgb, #d4af37 calc(var(--elite-tier, 1) * 15%), var(--border-strong));
  box-shadow: var(--shadow), 0 0 calc(var(--elite-tier, 1) * 2.5px) color-mix(in srgb, #d4af37 calc(var(--elite-tier, 1) * 12%), transparent);
}
.stat-card-elite .stat-label, .session-stat-card-elite .session-stat-label {
  color: color-mix(in srgb, #d4af37 calc(var(--elite-tier, 1) * 12%), var(--muted));
}
.stat-card-elite-max::after {
  background-image: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.6) 48%,
    color-mix(in srgb, #d4af37 70%, transparent) 52%, transparent 62%);
}
.stat-label { font-size: 0.73rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  margin: 0 0 5px; }
.stat-value { font-size: 1.65rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 0.8rem; color: var(--muted-faint); margin-top: 3px; }
@media (prefers-color-scheme: dark) {
  .stat-value { text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 28%, transparent); }
}
.empty-note { color: var(--muted); padding: var(--space-6) var(--space-4); text-align: center;
  border: 1px dashed var(--border); border-radius: var(--radius-md); }
.empty-note-icon { font-size: 1.9rem; margin-bottom: var(--space-2); opacity: 0.75; }

/* Any stat card built from a "top 1 of N" real aggregate (see recapStat's own Breakdown field in
   summary.go) -- Notable/rare finds only ever showed the single most-common type, discarding the
   rest; clicking a card like this now opens a modal listing every real item instead. A small "›"
   affordance marks a card as expandable; the
   modal itself follows the same overlay/panel visual language as the Powerplay page's own cycle
   viewer modal, kept as independent class names here since this page didn't have a modal system
   yet either. */
.stat-card-clickable, .session-stat-card-clickable { cursor: pointer; position: relative; }
.stat-card-clickable::before, .session-stat-card-clickable::before {
  content: '›'; position: absolute; top: var(--space-2); right: var(--space-3);
  color: var(--muted-faint); font-size: 1.1rem; font-weight: 700; line-height: 1;
}
.breakdown-modal-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.55); display: flex;
  align-items: center; justify-content: center; z-index: 100; padding: var(--space-4); }
.breakdown-modal-overlay[hidden] { display: none; }
.breakdown-modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); max-width: 480px; width: 100%; max-height: 75vh; overflow-y: auto;
  padding: var(--space-5); }
.breakdown-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);
  margin-bottom: var(--space-3); }
.breakdown-modal-title { font-size: 1.05rem; font-weight: 700; }
.breakdown-modal-close { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); line-height: 1; padding: 4px; }
.breakdown-modal-close:hover { color: var(--text); }
.breakdown-list { display: flex; flex-direction: column; gap: 4px; }
.breakdown-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: 0.85rem; }
.breakdown-row:nth-child(odd) { background: var(--bg); }
.breakdown-row-name { flex: 1; }
.breakdown-row-value { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Deliberately NOT a .page-nav-link -- a nav-styled pill would read as "one more page to
   visit," not a settings control. Fixed to the actual viewport corner (not just the top of the
   document) so it reads as persistent app chrome, closer to a game HUD's settings icon than
   another link in a row. */
.theme-toggle { position: fixed; top: var(--space-4); right: var(--space-4); z-index: 20;
  display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
  cursor: pointer; font-size: 1.05rem; line-height: 1; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius-pill); box-shadow: var(--shadow);
  transition: border-color var(--transition), transform var(--transition); }
.theme-toggle:hover { border-color: var(--accent); transform: translateY(-1px); }
</style>

<script>
const DATA = JSON.parse(document.getElementById('recap-data').textContent);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Highlights are {text, timestamp} objects (timestamp empty for the one summary line that has no
// single real moment, "...and N earlier deaths not shown here"). Short readable form, not a raw
// ISO string.
function fmtHighlightDate(iso) {
  if (!iso) return '';
  return iso.replace('T', ' ').replace('Z', '') + ' UTC';
}
// eliteTier 1-6 (1 = "Elite", 6 = max prestige "Elite V", see recapStat's own Go-side comment)
// drives a continuously-scaling gold border/glow via the
// --elite-tier custom property; only the true max tier gets the full foil treatment instead of
// the plain danger/rare gold border.
function eliteClass(stat) {
  if (!stat.eliteTier) return '';
  return stat.eliteTier >= 6 ? ' stat-card-elite stat-card-elite-max' : ' stat-card-elite';
}
function eliteStyle(stat) {
  return stat.eliteTier ? ` style="--elite-tier:${stat.eliteTier}"` : '';
}

// Any stat card built from a "top 1 of N" real aggregate opens a modal with the full real
// breakdown instead of just the winner (see recapStat.Breakdown's own Go-side comment for the
// full list this ended up covering). The full breakdown is embedded as a data attribute (JSON, HTML-
// escaped) rather than looked up by section/stat index, since this same render path is shared by
// both the all-time sections and the session recap's own flattened stat list, which don't share
// an indexing scheme.
function breakdownAttr(stat) {
  if (!stat.breakdown || !stat.breakdown.length) return { cls: '', attr: '' };
  return {
    cls: ' stat-card-clickable',
    attr: ` data-breakdown="${escapeHtml(JSON.stringify(stat.breakdown))}" data-breakdown-label="${escapeHtml(stat.label)}"`,
  };
}
function openBreakdownModal(label, items) {
  document.getElementById('breakdownModalTitle').textContent = label;
  document.getElementById('breakdownModalBody').innerHTML = items.map(it => `
    <div class="breakdown-row">
      <span class="breakdown-row-name">${escapeHtml(it.label)}</span>
      <span class="breakdown-row-value">${escapeHtml(it.value)}</span>
    </div>`).join('');
  document.getElementById('breakdownModalOverlay').hidden = false;
}
document.getElementById('breakdownModalClose').addEventListener('click', () => {
  document.getElementById('breakdownModalOverlay').hidden = true;
});
document.getElementById('breakdownModalOverlay').addEventListener('click', e => {
  if (e.target.id === 'breakdownModalOverlay') document.getElementById('breakdownModalOverlay').hidden = true;
});
document.addEventListener('click', e => {
  const card = e.target.closest('[data-breakdown]');
  if (!card) return;
  openBreakdownModal(card.getAttribute('data-breakdown-label'), JSON.parse(card.getAttribute('data-breakdown')));
});

// Real bug this fixed: execCommand('copy') needs the source element to actually have browser
// FOCUS, not just a text selection, in enough real browsers that skipping ta.focus() here made
// the fallback silently do nothing whenever the Clipboard API path also failed (e.g. opened as a
// bare file:// page, where clipboard permission often isn't granted) -- while the UI still
// unconditionally claimed success either way, so a real failure looked to the user like the
// paste itself was broken/rejected rather than the copy never having happened at all. Now checks
// execCommand's own success return value and reports the real outcome.
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* best effort */ }
  document.body.removeChild(ta);
  return ok;
}
function copyWithFeedback(btn, text) {
  const showResult = ok => {
    const original = btn.textContent;
    btn.textContent = ok ? '✓ Copied' : '✗ Failed';
    btn.classList.add(ok ? 'copied' : 'copy-failed');
    if (!ok) btn.title = 'Copy failed -- your browser blocked clipboard access. Select the text manually instead.';
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove(ok ? 'copied' : 'copy-failed');
    }, ok ? 1200 : 2500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showResult(true), () => showResult(fallbackCopy(text)));
  } else {
    showResult(fallbackCopy(text));
  }
}

function formatRecapForDiscord() {
  const lines = [
    `🚀 **CMDR ${DATA.commander || 'Unknown'}'s Career Recap**`,
    `_Generated ${DATA.generatedAt}_`,
    '',
  ];
  for (const section of DATA.sections) {
    lines.push(`**${section.title}**`);
    for (const stat of section.stats) {
      lines.push(`  ${stat.label}: **${stat.value}**${stat.sub ? ` (${stat.sub})` : ''}`);
    }
    lines.push('');
  }
  if (DATA.highlights.length) {
    lines.push('**Highlights**');
    for (const h of DATA.highlights) lines.push(`  ${h.text}${h.timestamp ? ` (${fmtHighlightDate(h.timestamp)})` : ''}`);
  }
  return lines.join('\n').trim();
}
document.getElementById('discordCopyBtn').addEventListener('click', () => {
  copyWithFeedback(document.getElementById('discordCopyBtn'), formatRecapForDiscord());
});

// Same per-stat formatting formatRecapForDiscord uses, just scoped to one section -- for sharing
// a single category (e.g. just Career Earnings) without pasting the whole recap.
function formatSectionForDiscord(section) {
  const lines = [`**${section.title}**`];
  for (const stat of section.stats) {
    lines.push(`  ${stat.label}: **${stat.value}**${stat.sub ? ` (${stat.sub})` : ''}`);
  }
  return lines.join('\n');
}
// Delegated rather than bound per-button: the section list is rebuilt from DATA.sections below,
// so binding individual listeners would mean rebinding every time; one listener on the
// already-static #sections container works regardless of how many sections render.
document.getElementById('sections').addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn-small');
  if (!btn) return;
  const section = DATA.sections[Number(btn.dataset.sectionIndex)];
  if (!section) return;
  copyWithFeedback(btn, formatSectionForDiscord(section));
});

const totalStats = DATA.sections.reduce((n, s) => n + s.stats.length, 0);
document.getElementById('subtitle').textContent =
  `Generated ${DATA.generatedAt} — ${totalStats} stats across ${DATA.sections.length} categories, computed from your whole journal history.`;

// DATA.session (see summary.go's BuildSessionRecap) is the exact same recapData shape as the
// all-time recap, just scoped to events since the most
// recent real LoadGame -- BuildRecap already gates most of its own sections to only appear when
// something real happened (no Powerplay section if never pledged, no Crime section if no crimes,
// etc), so a single short session naturally ends up compact without needing a separate "pick the
// best N stats" heuristic here -- every stat shown is real and actually happened this session.
function formatSessionDuration(fromIso, toIso) {
  const ms = new Date(toIso).getTime() - new Date(fromIso).getTime();
  if (!(ms > 0)) return '';
  const totalMinutes = Math.round(ms / 60000);
  const h = Math.floor(totalMinutes / 60), m = totalMinutes % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
if (DATA.session) {
  const s = DATA.session;
  const allStats = s.recap.sections.flatMap(sec => sec.stats);
  const duration = formatSessionDuration(s.sessionFrom, s.sessionTo);
  const rangeBit = `${escapeHtml(s.sessionFrom.replace('T', ' ').replace('Z', ''))} -- ${escapeHtml(s.sessionTo.replace('T', ' ').replace('Z', ''))} UTC${duration ? ` (${duration})` : ''}`;
  const highlightsHtml = s.recap.highlights.length
    ? `<div class="highlights" style="margin-top:var(--space-3);margin-bottom:0">${s.recap.highlights.map(h => `<div class="highlight">${escapeHtml(h.text)}${h.timestamp ? `<div class="highlight-date">${escapeHtml(fmtHighlightDate(h.timestamp))}</div>` : ''}</div>`).join('')}</div>`
    : '';
  const statsHtml = allStats.length
    ? `<div class="session-stat-grid">${allStats.map(stat => `
        <div class="session-stat-card${stat.danger ? ' stat-card-danger' : ''}${stat.dangerExtreme ? ' stat-card-danger-extreme' : ''}${stat.rare ? ' stat-card-rare' : ''}${eliteClass(stat)}${breakdownAttr(stat).cls}"${eliteStyle(stat)}${breakdownAttr(stat).attr}>
          <div class="session-stat-label">${escapeHtml(stat.label)}</div>
          <div class="session-stat-value">${escapeHtml(stat.value)}</div>
          ${stat.sub ? `<div class="session-stat-sub">${escapeHtml(stat.sub)}</div>` : ''}
        </div>
      `).join('')}</div>`
    : '<p class="session-recap-empty">Nothing recap-worthy happened this session -- just some flying around, maybe.</p>';
  document.getElementById('sessionRecap').innerHTML = `
    <div class="session-recap">
      <div class="session-recap-title">🕐 Last Session <span class="session-recap-range">${rangeBit}</span>
        <button class="copy-btn-small" type="button" id="sessionDiscordCopyBtn">💬 Copy for Discord</button>
      </div>
      ${highlightsHtml}
      ${statsHtml}
    </div>`;
  wireHoloCards(document.getElementById('sessionRecap'));
  // Same per-stat formatting formatRecapForDiscord/formatSectionForDiscord already use, just
  // scoped to the session's own flattened stats + highlights instead of the all-time
  // DATA.sections.
  document.getElementById('sessionDiscordCopyBtn').addEventListener('click', () => {
    const lines = [`🕐 **Last Session** (${rangeBit})`, ''];
    for (const stat of allStats) {
      lines.push(`  ${stat.label}: **${stat.value}**${stat.sub ? ` (${stat.sub})` : ''}`);
    }
    if (s.recap.highlights.length) {
      lines.push('', '**Highlights**');
      for (const h of s.recap.highlights) lines.push(`  ${h.text}${h.timestamp ? ` (${fmtHighlightDate(h.timestamp)})` : ''}`);
    }
    copyWithFeedback(document.getElementById('sessionDiscordCopyBtn'), lines.join('\n').trim());
  });
}

// Real cursor-tracking, not a fixed one-shot animation. Live mousemove updates the CSS custom
// properties the .stat-card-danger/.stat-card-rare rules above read (--holo-px/py position the
// shine, --holo-rx/ry drive the tilt); mouseleave smoothly resets to neutral via the CSS
// transition already on those properties' consuming rules. Delegated at the container level (one
// listener per render, not one per card) since these sections get fully rebuilt on load.
function wireHoloCards(container) {
  if (!container) return;
  container.querySelectorAll('.stat-card-danger-extreme, .stat-card-rare, .stat-card-elite-max').forEach(card => {
    card.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      const px = ((e.clientX - rect.left) / rect.width) * 100;
      const py = ((e.clientY - rect.top) / rect.height) * 100;
      const rx = (px / 100 - 0.5) * 16;  // left/right cursor position -> tilt around the vertical axis
      const ry = (py / 100 - 0.5) * -16; // up/down cursor position -> tilt around the horizontal axis
      card.style.setProperty('--holo-px', `${px}%`);
      card.style.setProperty('--holo-py', `${py}%`);
      card.style.setProperty('--holo-rx', rx.toFixed(2));
      card.style.setProperty('--holo-ry', ry.toFixed(2));
      card.style.setProperty('--holo-scale', '1.06');
      card.style.setProperty('--holo-lift', '-6px');
      card.style.setProperty('--holo-opacity', '1');
      card.classList.add('holo-active');
    });
    card.addEventListener('mouseleave', () => {
      card.style.setProperty('--holo-rx', '0');
      card.style.setProperty('--holo-ry', '0');
      card.style.setProperty('--holo-scale', '1');
      card.style.setProperty('--holo-lift', '0px');
      card.style.setProperty('--holo-opacity', '0');
      card.classList.remove('holo-active');
    });
  });
}

document.getElementById('highlights').innerHTML = DATA.highlights
  .map(h => `<div class="highlight">${escapeHtml(h.text)}${h.timestamp ? `<div class="highlight-date">${escapeHtml(fmtHighlightDate(h.timestamp))}</div>` : ''}</div>`)
  .join('');

document.getElementById('sections').innerHTML = DATA.sections.length
  ? DATA.sections.map((section, i) => `
    <div class="section">
      <div class="section-title">
        <span>${escapeHtml(section.title)}</span>
        <button class="copy-btn-small" type="button" data-section-index="${i}">💬 Copy</button>
      </div>
      <div class="stat-grid">
        ${section.stats.map(stat => `
          <div class="stat-card${stat.danger ? ' stat-card-danger' : ''}${stat.dangerExtreme ? ' stat-card-danger-extreme' : ''}${stat.rare ? ' stat-card-rare' : ''}${eliteClass(stat)}${breakdownAttr(stat).cls}"${eliteStyle(stat)}${breakdownAttr(stat).attr}>
            <div class="stat-label">${escapeHtml(stat.label)}</div>
            <div class="stat-value">${escapeHtml(stat.value)}</div>
            ${stat.sub ? `<div class="stat-sub">${escapeHtml(stat.sub)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('')
  : '<div class="empty-note"><div class="empty-note-icon">📊</div>No recap-relevant events found in your journal yet.</div>';
wireHoloCards(document.getElementById('sections'));

// Manual light/dark override -- CSS already auto-follows the OS via
// @media(prefers-color-scheme), but that gives no way to actually compare both from inside the
// page. Stamping data-theme on <html> and pairing it with the :root[data-theme=...] blocks above (each with
// higher specificity than the plain :root a media query targets) lets an explicit choice win
// regardless of OS preference, in either direction. The tiny inline script in <head> applies any
// saved choice before first paint, so there's no flash of the wrong theme on load.
function currentTheme() {
  const forced = document.documentElement.getAttribute('data-theme');
  if (forced === 'light' || forced === 'dark') return forced;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function updateThemeToggleLabel() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  // Icon-only, shows the CURRENTLY ACTIVE theme (sun when light, moon when dark) -- a state
  // indicator you click to flip, same idea as a physical light switch showing its own position.
  const dark = currentTheme() === 'dark';
  btn.textContent = dark ? '🌙' : '☀️';
  btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
// Carries an EXPLICIT theme choice into the other pages' nav links (as a ?theme= query param)
// so it actually persists when clicking around -- these are separate file:// documents, and
// browsers don't reliably share localStorage between distinct local files (some isolate storage
// per exact file path), so localStorage alone silently failed to survive navigation on its own,
// and the theme choice needs to persist across pages. Only rewrites hrefs once a real choice has been
// made (theme is truthy) -- before that, nav links stay plain so OS/media-query preference keeps
// being picked up fresh on every page, same as before this existed.
function propagateThemeToNavLinks(theme) {
  document.querySelectorAll('.page-nav-link[href]').forEach(a => {
    const base = a.getAttribute('href').split('?')[0];
    a.setAttribute('href', theme ? base + '?theme=' + theme : base);
  });
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('standalone_theme', theme); } catch (e) { /* storage unavailable */ }
  updateThemeToggleLabel();
  propagateThemeToNavLinks(theme);
}
const themeToggleBtn = document.getElementById('themeToggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
}
updateThemeToggleLabel();
propagateThemeToNavLinks(document.documentElement.getAttribute('data-theme'));
</script>
</body>
</html>
