name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: standalone-go/go.mod

      # Embeds product/version info + a manifest into the Windows build. Without it, the
      # Windows .exe has zero PE metadata at all, which is exactly the shape Windows Defender's
      # ML heuristic tends to flag as a false positive (Trojan:Win32/Wacatac.B!ml).
      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Build all platforms
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd standalone-go
          ./build.sh ../dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edjournalatlas-binaries
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
